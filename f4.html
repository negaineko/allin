  <script type="text/plain" id="raw_q_text">
1. 条件电位是指( )
A. 任意浓度下的电极电位
B. 任意温度下的电极电位
C. 电对的氧化型和还原型的浓度都等于 1 mol/L 时的电极电位
D. 在特定条件下, 氧化型和还原型的总浓度均为 1 mol/L 时, 校正了各种外界因素(酸度、配位反应等)影响后的实际电极电位

2. 对于半反应 $MnO_{4}^{-} + 8H^{+} + 5e^{-} \rightleftharpoons Mn^{2+} + 4H_{2}O$, 用条件电极电位表达的能斯特方程式是( )
A. $\varphi = \varphi^{\ominus\prime} + \frac{RT}{nF}\ln\frac{c_{MnO_{4}^{-}}}{c_{Mn^{2+}}}$
B. $\varphi = \varphi^{\ominus\prime} + \frac{RT}{nF}\ln\frac{a_{MnO_{4}^{-}}}{a_{Mn^{2+}}}$
C. $\varphi = \varphi^{\ominus\prime} + \frac{RT}{nF}\ln\frac{c_{MnO_{4}^{-}}[H^{+}]^8}{c_{Mn^{2+}}}$
D. $\varphi = \varphi^{\ominus\prime} + \frac{RT}{nF}\ln\frac{a_{MnO_{4}^{-}}[H^{+}]^8}{a_{Mn^{2+}}}$

3. 下列对条件电极电位没有影响的因素是( )
A. 配位效应
B. 沉淀效应
C. 溶液离子强度
D. 氧化型浓度

4. 欲以氧化剂 $Ox_1$ 滴定还原剂 $Red_2$, $Ox_1 + n_1e^{-} \rightleftharpoons Red_1$, $Ox_2 + n_2e^{-} \rightleftharpoons Red_2$, 设 $n_1=n_2=1$, 要使化学计量点时反应的完全程度达到99.9%, 两个半反应的标准电位的最小差值应为( )
A. 0.18V
B. 0.35V
C. 0.12V
D. 0.24V

5. 对于反应 $BrO_{3}^{-} + 6I^{-} + 6H^{+} \rightleftharpoons Br^{-} + 3I_{2} + 3H_{2}O$, 已知 $\varphi^{\ominus}(BrO_{3}^{-}/Br^{-})=1.44\text{V}$, $\varphi^{\ominus}(I_{2}/I^{-})=0.55\text{V}$, 则此反应平衡常数 $(25^\circ\text{C})$ 的对数 ($\lg K$) 为( )
A. $(1.44-0.55)/0.059$
B. $3\times(1.44-0.55)/0.059$
C. $2\times6\times(1.44-0.55)/0.059$
D. $6\times(1.44-0.55)/0.059$

6. 标定 $Na_{2}S_{2}O_{3}$ 时, 淀粉指示剂的加入时间为( )
A. 滴定开始
B. 反应中间
C. 反应结束
D. 接近终点

7. 为使反应 $2A^{+} + 3B^{4+} = 2A^{4+} + 3B^{2+}$ 完全度达到99.9%, 两电对的条件电位差至少大于( )
A. 0.10V
B. 0.12V
C. 0.15V
D. 0.18V

8. 已知在 $1\text{ mol/L HCl}$ 中 $\varphi^{\ominus\prime}(Cr_{2}O_{7}^{2-}/Cr^{3+})=1.00\text{V}$, $\varphi^{\ominus\prime}(Fe^{3+}/Fe^{2+})=0.68\text{V}$。以 $K_{2}Cr_{2}O_{7}$ 滴定 $Fe^{2+}$ 时, 下列指示剂中最合适的是( )
A. 二苯胺 ($\varphi^{\ominus}=0.76\text{V}$)
B. 二甲基邻二氮菲-$\text{Fe}^{2+}$ ($\varphi^{\ominus}=0.97\text{V}$)
C. 亚甲基蓝 ($\varphi^{\ominus}=0.53\text{V}$)
D. 中性红 ($\varphi^{\ominus}=0.24\text{V}$)

9. 用 $Fe^{3+}$ 滴定 $Sn^{2+}$, 在化学计量点的电位是 ($\varphi^{\ominus\prime}_{Fe^{3+}/Fe^{2+}}=0.68\text{V}$, $\varphi^{\ominus\prime}_{Sn^{4+}/Sn^{2+}}=0.14\text{V}$) ( )
A. 0.75V
B. 0.68V
C. 0.41V
D. 0.32V

10. $Ca^{2+}$ 既无氧化性, 又无还原性, 用 $KMnO_{4}$ 法测定时, 可以采用( )
A. 直接滴定方式
B. 间接滴定方式
C. 返滴定方式
D. 置换滴定方式

11. 用条件电极电位的大小不能判别( )
A. 氧化还原反应的速率
B. 氧化还原反应的方向
C. 氧化还原的能力大小
D. 氧化还原的完全程度

12. (1) 用 $0.2\text{ mol/L } KMnO_{4}$ 溶液滴定 $0.1\text{ mol/L } Fe^{2+}$ 溶液; (2) 用 $0.02\text{ mol/L } KMnO_{4}$ 溶液滴定 $0.01\text{ mol/L } Fe^{2+}$ 溶液。上述两种情况下滴定突跃( )
A. 一样大
B. (1) > (2)
C. (2) > (1)
D. 无法比较

13. 用 $Na_{2}C_{2}O_{4}$ 标定 $KMnO_{4}$ 时, 由于反应速率不够快, 因此滴定需要维持足够的酸度和温度, 但酸度和温度过高时, 又会发生( )
A. $H_{2}C_{2}O_{4}$ 挥发
B. $H_{2}C_{2}O_{4}$ 分解
C. $H_{2}C_{2}O_{4}$ 析出
D. $H_{2}C_{2}O_{4}$ 与空气中的氧发生氧化反应

14. 对 Ox-Red 电对, $25^\circ\text{C}$ 时条件电位 $\varphi^{\ominus\prime}$ 等于( )
A. $\varphi^{\ominus} + \frac{0.059}{n}\lg\frac{a_{Ox}}{a_{Red}}$
B. $\varphi^{\ominus} + \frac{0.059}{n}\lg\frac{c_{Ox}}{c_{Red}}$
C. $\varphi^{\ominus} + \frac{0.059}{n}\lg\frac{\gamma_{Ox}\cdot a_{Ox}}{\gamma_{Red}\cdot a_{Red}}$
D. $\varphi^{\ominus} + \frac{0.059}{n}\lg\frac{\gamma_{Ox}\cdot\alpha_{Red}}{\gamma_{Red}\cdot\alpha_{Ox}}$

15. 以下电对中, 条件电位随离子强度增高而增高的是( )
A. $Fe^{3+}/Fe^{2+}$
B. $Ce^{4+}/Ce^{3+}$
C. $Sn^{4+}/Sn^{2+}$
D. $Fe(CN)_{6}^{3-}/Fe(CN)_{6}^{4-}$

16. 在含有 $Fe^{3+}$ 和 $Fe^{2+}$ 的溶液中, 加入下述何种试剂, $Fe^{3+}/Fe^{2+}$ 电对的电位将升高(不考虑离子强度的影响)( )
A. 稀 $H_{2}SO_{4}$
B. HCl
C. $NH_{4}F$
D. 邻二氮菲

17. $Fe^{3+}$ 与 $Sn^{2+}$ 反应的平衡常数对数值 ($\lg K$) 为 [$\varphi^{\ominus}(Fe^{3+}/Fe^{2+})=0.77\text{V}, \varphi^{\ominus}(Sn^{4+}/Sn^{2+})=0.15\text{V}$]( )
A. $(0.77-0.15)/0.059$
B. $2\times(0.77-0.15)/0.059$
C. $3\times(0.77-0.15)/0.059$
D. $2\times(0.15-0.77)/0.059$

18. 当两电对的电子转移数均为 2 时, 为使反应完全度达到99.9%, 两电对的条件电位差至少应大于( )
A. 0.09 V
B. 0.18 V
C. 0.27 V
D. 0.36 V

19. 若两电对的电子转移数分别为 1 和 2, 为使反应完全度达到99.9%, 两电对的条件电位差至少应大于( )
A. 0.09 V
B. 0.18 V
C. 0.24 V
D. 0.27 V

20. 下列反应中滴定曲线在化学计量点前后对称的是( )
A. $2Fe^{3+} + Sn^{2+} = Sn^{4+} + 2Fe^{2+}$
B. $MnO_{4}^{-} + 5Fe^{2+} + 8H^{+} = Mn^{2+} + 5Fe^{3+} + 4H_{2}O$
C. $Ce^{4+} + Fe^{2+} = Ce^{3+} + Fe^{3+}$
D. $I_{2} + 2S_{2}O_{3}^{2-} = 2I^{-} + S_{4}O_{6}^{2-}$

21. 反应 $2A^{+} + 3B^{4+} \rightarrow 2A^{4+} + 3B^{2+}$ 到达化学计量点时电位是( )
A. $[\varphi^{\ominus}(A) + \varphi^{\ominus}(B)]/2$
B. $[2\varphi^{\ominus}(A) + 3\varphi^{\ominus}(B)]/5$
C. $[3\varphi^{\ominus}(A) + 2\varphi^{\ominus}(B)]/5$
D. $6[\varphi^{\ominus}(A) - \varphi^{\ominus}(B)]/0.059$

22. 已知在 $1\text{ mol/L HCl}$ 中, $\varphi^{\ominus\prime}(Fe^{3+}/Fe^{2+})=0.68\text{V}, \varphi^{\ominus\prime}(Sn^{4+}/Sn^{2+})=0.14\text{V}$, 计算以 $Fe^{3+}$ 滴定 $Sn^{2+}$ 至 99.9%、100%、100.1% 时的电位分别为( )
A. 0.50 V、0.41 V、0.32 V
B. 0.17 V、0.32 V、0.56 V
C. 0.23 V、0.41 V、0.50 V
D. 0.23 V、0.32 V、0.50 V

23. 用 $K_{2}Cr_{2}O_{7}$ 滴定 $Fe^{2+}$, 在化学计量点时, 有关离子浓度的关系是( )
A. $[Fe^{3+}] = [Cr^{3+}], [Fe^{2+}] = [Cr_{2}O_{7}^{2-}]$
B. $3[Fe^{3+}] = [Cr^{3+}], [Fe^{2+}] = 6[Cr_{2}O_{7}^{2-}]$
C. $[Fe^{3+}] = 3[Cr^{3+}], [Fe^{2+}] = 6[Cr_{2}O_{7}^{2-}]$
D. $[Fe^{3+}] = 3[Cr^{3+}], 6[Fe^{2+}] = [Cr_{2}O_{7}^{2-}]$

24. 已知 $\varphi^{\ominus\prime}(Ce^{4+}/Ce^{3+})=1.44\text{V}, \varphi^{\ominus\prime}(Fe^{3+}/Fe^{2+})=0.68\text{V}$, 则反应 $Ce^{4+} + Fe^{2+} = Ce^{3+} + Fe^{3+}$ 在化学计量点时溶液中 $c(Fe^{3+})/c(Fe^{2+})$ 为( )
A. $1.1\times10^{-18}$
B. 92.5
C. 36.2
D. $2.8\times10^{6}$

A. $[Ce^{4+}] = [Fe^{2+}] = 1.8\times10^{-8}\text{ mol/L}, [Ce^{3+}] = [Fe^{3+}] \approx 0.050\text{ mol/L}$

  </script>

  <script>
    /**
     * 第四单元 题库标准答案映射字典 (1~37题)
     */
    const ansMap = {
      // 模板核心题 (1~13)
      1: 'D',  // 条件电极电位定义
      2: 'A',  // 条件能斯特方程已归并酸度项
      3: 'D',  // 条件电位本身是活度为1时的常数，与浓度无关
      4: 'B',  // Δφ ≥ (0.059/1)*3*2 ≈ 0.354V
      5: 'D',  // lg K = n*Δφ / 0.059 = 6 * (1.44 - 0.55) / 0.059
      6: 'D',  // 接近终点时加淀粉
      7: 'A',  // 电子转移数多，完全度达到99.9%电位差阈值降低
      8: 'B',  // 计量点电位在 0.85~0.95V 附近，二甲基邻二氮菲-Fe(II) (0.97V) 变色最敏锐
      9: 'D',  // φ_sp = (1*0.68 + 2*0.14)/3 = 0.32V
      10: 'B', // 间接法：沉淀分离草酸钙后酸化用高锰酸钾滴定
      11: 'A', // 热力学常数不能判定动力学反应速率
      12: 'A', // 对称电对突跃与反应物浓度无关
      13: 'B', // 高温强酸导致草酸分解

      // 专项讲义题 (14~37)
      14: 'D', // 条件电位与副反应系数、活度系数的严谨表达式
      15: 'D', // 产物电荷高，高离子强度下γ降低更显著导致电位升高
      16: 'D', // 邻二氮菲优先与 Fe2+ 络合，降低还原型游离浓度使电对电位升高
      17: 'B', // 转移电子数 n=2，lg K = 2*(0.77-0.15)/0.059
      18: 'B', // n1=n2=2 时，Δφ ≥ 0.059/2 * 6 = 0.177V ≈ 0.18V
      19: 'C', // n1=1, n2=2 时，Δφ ≥ 0.059*(3/1 + 3/2) = 0.2655V ≈ 0.27V (或按0.24V~0.27V判据)
      20: 'C', // 转移电子数相同(1:1)的电对对称
      21: 'B', // 0.059*(8/5) * lg[H+] = -0.0944 pH
      22: 'D', // 加入纯铁屑还原抗氧化
      23: 'D', // lg K = 6*(1.44-0.55)/0.059
      24: 'C', // 氧化型比还原型，副反应系数在分母
      25: 'B', // n1=n2=1 时，Δφ ≥ 3*(0.059+0.059) = 0.354V
      26: 'C', // φ = 0.80 + 0.059*lg(Ksp) = 0.80 - 0.57 = 0.23V
      27: 'B', // 滴定至 50% 处，[Fe3+]=[Fe2+]，体系电位等于该电对条件电位 0.68V
      28: 'D', // φ_sp = (1*0.68 + 2*0.14)/3 = 0.32V
      29: 'A', // 反应产物稀释后约 0.050 mol/L，剩余反应物利用平衡常数求得 1.8e-8 mol/L
      30: 'B', // 重铬酸钾滴定铁选二甲基邻二氮菲-Fe(II)
      31: 'C', // 磷酸与 Fe3+ 络合降低 Fe3+/Fe2+ 电位，消除显色并减小电位
      32: 'B', // 8H+/5e 对应 -0.094pH
      33: 'D', // 加入金属铁防止亚铁氧化
      34: 'C', // 活度系数与副反应系数联合修正
      35: 'C', // 氯化银沉淀电极电位 0.23V
      36: 'B', // 50% 滴定分数对应半中和点
      37: 'A'  // 计量点各组分浓度分布
    };

    // 全局状态
    let questions = [];
    let currentIndex = 0;
    let mode = 'practice';
    let currentFilter = 'all';
    
    // 本地存储状态
    let userAnswers = {};
    let starred = new Set();

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      parseRawQuestions();
      renderUI();
      bindShortcuts();
    });

    /**
     * 题库解析
     */
    function parseRawQuestions() {
      const rawText = document.getElementById('raw_q_text').textContent;
      const lines = rawText.split(/\r?\n/);
      
      questions = [];
      let currentQ = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        const qMatch = trimmed.match(/^(\d+)[\.、\s]+(.*)/);
        const optMatch = trimmed.match(/^([A-E])[\.、\s]+(.*)/);

        if (qMatch && !optMatch) {
          if (currentQ) questions.push(currentQ);
          currentQ = {
            id: parseInt(qMatch[1], 10),
            text: qMatch[2].trim(),
            options: [],
            correct: ansMap[parseInt(qMatch[1], 10)] || ''
          };
        } else if (optMatch && currentQ) {
          currentQ.options.push({
            key: optMatch[1],
            text: optMatch[2].trim()
          });
        } else if (currentQ) {
          if (currentQ.options.length === 0) {
            currentQ.text += '<br>' + trimmed;
          } else {
            currentQ.options[currentQ.options.length - 1].text += ' ' + trimmed;
          }
        }
      }

      if (currentQ) questions.push(currentQ);
    }

    /**
     * 本地存储处理
     */
    function loadStorage() {
      try {
        const savedAns = localStorage.getItem('anal_chem_redox_v1');
        if (savedAns) userAnswers = JSON.parse(savedAns);
        const savedStars = localStorage.getItem('anal_chem_redox_stars_v1');
        if (savedStars) starred = new Set(JSON.parse(savedStars));
      } catch (e) {
        console.error('Storage access error', e);
      }
    }

    function saveStorage() {
      localStorage.setItem('anal_chem_redox_v1', JSON.stringify(userAnswers));
      localStorage.setItem('anal_chem_redox_stars_v1', JSON.stringify(Array.from(starred)));
    }

    function resetProgress() {
      if (confirm('确定要清空氧化还原滴定单元全部 37 题的答题记录和收藏吗？')) {
        userAnswers = {};
        starred.clear();
        saveStorage();
        renderUI();
      }
    }

    /**
     * UI 渲染主流程
     */
    function renderUI() {
      if (questions.length === 0) return;
      const q = questions[currentIndex];

      document.getElementById('qMeta').innerText = `单选题 第 ${q.id} / ${questions.length} 题`;
      document.getElementById('qText').innerHTML = q.text;

      const starBtn = document.getElementById('starBtn');
      if (starred.has(q.id)) {
        starBtn.classList.add('starred');
      } else {
        starBtn.classList.remove('starred');
      }

      const optContainer = document.getElementById('optionsContainer');
      optContainer.innerHTML = '';

      const userChoice = userAnswers[q.id];
      const isAnswered = !!userChoice;

      q.options.forEach(opt => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option-item';
        
        if (mode === 'practice' && isAnswered) {
          if (opt.key === q.correct) {
            optDiv.classList.add('correct');
          } else if (opt.key === userChoice) {
            optDiv.classList.add('wrong');
          }
        } else if (mode === 'exam' && userChoice === opt.key) {
          optDiv.classList.add('selected');
        }

        optDiv.onclick = () => selectOption(opt.key);

        optDiv.innerHTML = `
          <div class="option-key">${opt.key}</div>
          <div class="option-text">${opt.text}</div>
        `;
        optContainer.appendChild(optDiv);
      });

      const banner = document.getElementById('resultBanner');
      if (mode === 'practice' && isAnswered) {
        banner.className = 'result-banner show ' + (userChoice === q.correct ? 'correct-banner' : 'wrong-banner');
        banner.innerHTML = userChoice === q.correct 
          ? `🎉 回答正确！标准答案：<b>${q.correct}</b>` 
          : `❌ 回答错误。你的选择：<b>${userChoice}</b>，标准答案：<b>${q.correct}</b>`;
      } else {
        banner.className = 'result-banner';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === questions.length - 1);

      updateStatsAndCard();

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([document.querySelector('.question-pane')]);
      }
    }

    function selectOption(key) {
      const q = questions[currentIndex];
      userAnswers[q.id] = key;
      saveStorage();
      renderUI();
    }

    function toggleStar() {
      const q = questions[currentIndex];
      if (starred.has(q.id)) {
        starred.delete(q.id);
      } else {
        starred.add(q.id);
      }
      saveStorage();
      renderUI();
    }

    function navigate(delta) {
      const nextIdx = currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIndex = nextIdx;
        renderUI();
      }
    }

    function jumpTo(index) {
      currentIndex = index;
      renderUI();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('modeExam').classList.toggle('active', mode === 'exam');
      renderUI();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      updateStatsAndCard();
    }

    function updateStatsAndCard() {
      let doneCount = 0;
      let correctCount = 0;

      questions.forEach(q => {
        if (userAnswers[q.id]) {
          doneCount++;
          if (userAnswers[q.id] === q.correct) correctCount++;
        }
      });

      document.getElementById('statDone').innerText = `${doneCount}/${questions.length}`;
      document.getElementById('statStar').innerText = starred.size;
      const rate = doneCount === 0 ? 0 : Math.round((correctCount / doneCount) * 100);
      document.getElementById('statRate').innerText = `${rate}%`;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const uAns = userAnswers[q.id];
        const isWrong = uAns && uAns !== q.correct;
        const isStar = starred.has(q.id);

        if (currentFilter === 'wrong' && !isWrong) return;
        if (currentFilter === 'star' && !isStar) return;

        const item = document.createElement('div');
        item.className = 'card-item';
        if (idx === currentIndex) item.classList.add('active');

        if (mode === 'practice') {
          if (uAns) {
            item.classList.add(uAns === q.correct ? 'correct' : 'wrong');
          }
        } else {
          if (uAns) item.classList.add('answered-exam');
        }

        item.innerText = q.id;
        if (isStar) {
          const starIcon = document.createElement('span');
          starIcon.className = 'star-dot';
          starIcon.innerText = '★';
          item.appendChild(starIcon);
        }

        item.onclick = () => jumpTo(idx);
        grid.appendChild(item);
      });
    }

    function bindShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D', 'E'].includes(key)) {
          selectOption(key);
        } else if (e.key === 'ArrowLeft') {
          navigate(-1);
        } else if (e.key === 'ArrowRight') {
          navigate(1);
        }
      });
    }
  </script>
</body>
</html>
