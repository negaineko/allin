1. 用重量法测定 $As_2O_3$ 的含量时, 将 $As_2O_3$ 在碱性溶液中转变为 $AsO_4^{3-}$, 并沉淀为 $Ag_3AsO_4$, 随后在 $HNO_3$ 介质中转变为AgCl沉淀, 并以AgCl称量。其化学因数为( )
A. $M_r(As_2O_3) / [6M_r(AgCl)]$
B. $2M_r(As_2O_3) / [3M_r(AgCl)]$
C. $M_r(As_2O_3) / M_r(AgCl)$
D. $3M_r(AgCl) / [6M_r(As_2O_3)]$

2. 在重量分析中, 洗涤无定形沉淀的洗涤液应是( )
A. 冷水
B. 含沉淀剂的稀溶液
C. 热的电解质溶液
D. 热水

3. 若A为强酸根, 存在可与金属离子形成配合物的试剂L, 则难溶化合物MA的溶解度计算式为( )
A. $\sqrt{K_{sp}/\alpha_{M(L)}}$
B. $\sqrt{K_{sp}\alpha_{M(L)}}$
C. $\sqrt{K_{sp}/\alpha_{M(L)} + 1}$
D. $\sqrt{K_{sp}\alpha_{M(L)} + 1}$

4. $Ra^{2+}$ 与 $Ba^{2+}$ 的离子结构相似, 因此可以利用 $BaSO_4$ 沉淀从溶液中富集微量 $Ra^{2+}$, 这种富集方式是利用了( )

B. 包夹共沉淀
C. 表面吸附共沉淀
D. 固体萃取共沉淀

B. 防止 AgCl 凝聚
C. 防止 AgCl 沉淀转化
D. 防止 AgCl 感光

6. 重量分析中, 当杂质在沉淀过程中以混晶形式进入沉淀时, 主要是由于( )

B. 表面吸附

A. $SO_4^{2-}$ 和 $Ca^{2+}$
B. $Ba^{2+}$ 和 $CO_3^{2-}$
C. $CO_3^{2-}$ 和 $Ca^{2+}$
D. $H^+$ 和 $\text{Cl}^-$

8. Mohr 法不能用于碘化物中碘的测定, 主要因为( )
A. AgI 的溶解度太小
B. AgI 的吸附能力太强
C. AgI 的沉淀速度太慢
D. 没有合适的指示剂

9. 用 Mohr 法测定 $\text{Cl}^-$, 控制 $\text{pH}=4.0$, 其滴定终点将( )
A. 不受影响
B. 提前到达
C. 推迟到达
D. 刚好等于化学计量点

10. 对于晶型沉淀而言, 选择适当的沉淀条件达到的主要目的是( )
A. 减少后沉淀
B. 增大均相成核作用
C. 得到大颗粒沉淀
D. 加快沉淀沉降速率

11. 沉淀重量法中, 称量形式的摩尔质量越大,( )
A. 沉淀越易于过滤洗涤
B. 沉淀越纯净

B. $A_r(Ca) / M_r(CaCO_3)$

B. 0.2477
C. 0.3711
D. 0.4948

  </script>

  <script>
    /**
     * 第五单元 题库标准答案映射字典 (1~44题)
     */
    const ansMap = {
      // 模板原题 (1~12)
      1: 'A',  // 换算因数 F = M(As2O3) / [6 * M(AgCl)]
      2: 'C',  // 无定形沉淀防胶溶选热电解质溶液
      3: 'B',  // 配位效应下溶解度 S = sqrt(Ksp * α_M(L))
      4: 'A',  // Ra2+与Ba2+同族半径相似形成混晶
      5: 'B',  // 糊精保护胶体防止凝聚
      6: 'D',  // 混晶产生主因是离子结构、半径及晶体构型相似
      7: 'D',  // 强酸性介质中BaSO4优先吸附本晶离子，反离子层吸附H+和Cl-
      8: 'B',  // AgI吸附I-过强致使终点拖尾严重
      9: 'C',  // 酸度太高使重铬酸根平衡移动，终点推迟
      10: 'C', // 晶型沉淀控制过饱和度以获得大颗粒
      11: 'D', // 摩尔质量大则换算因数小，称量误差影响小
      12: 'B', // 难挥发沉淀剂过量20%~30%

      // 讲义专属扩充题 (13~44)
      13: 'C', // 1100℃灼烧后称量形式为 CaO，换算因数为 Ar(Ca)/Mr(CaO)
      14: 'D', // 对应 As2O3 / 6AgCl
      15: 'B', // m = (10.0mg * 35.5/143.3) / 1.00% = 0.2477g
      16: 'B', // w(湿) = 54.00% * (1 - 1.00%) = 53.46%
      17: 'D', // S考虑酸效应时需修正 x(S2-)，S = (Ksp / [4*x(S2-)])^(1/3)
      18: 'C', // 同离子效应联合酸效应计算公式
      19: 'D', // c(OH-) = 0.05000*20.00/50.00 = 0.020 mol/L, c(Ca2+) = 0.010 mol/L, Ksp = 0.010*(0.020)^2 = 4.0e-6
      20: 'C', // c(B)=3.0e-3, c(A)=2.0e-3, Ksp = (2.0e-3)^2 * (3.0e-3)^3 = 1.08e-14 ≈ 1.0e-14
      21: 'A', // 半径电荷相近形成混晶
      22: 'D', // 非晶形沉淀严禁陈化（陈化易发生结块杂质包裹）
      23: 'C', // 潘内斯-法扬斯规则，电荷高(Ca2+)且能与SO4(2-)生成微溶物者优先吸附
      24: 'B', // 吸附在表面的杂质通过洗涤最易洗除
      25: 'C', // 增大氨浓度使Zn2+、Ni2+生成氨络离子溶解减少吸附，碱性增强使Ca2+、Mg2+水解沉淀吸附增加
      26: 'C', // MgC2O4后沉淀严重，应缩短陈化时间并二次沉淀
      27: 'B', // 临界值 Q/S 愈大，越容易自发均相成核，故 B 说法错误
      28: 'D', // 洗涤AgCl选稀HNO3，防止胶溶且易于干燥挥发
      29: 'C', // 热称由于空气对流和浮力减小，导致称量读数偏小？若为挥发水分，读数偏小导致计算的水分偏高
      30: 'A', // Fe3+共沉淀生成Fe2(SO4)3，灼烧生成Fe2O3使质量偏小
      31: 'C', // 莫尔法酸度太高，CrO4(2-)转变为Cr2O7(2-)，导致Ag2CrO4延迟沉淀
      32: 'C', // 指示剂必须解离成阴离子且不能在强碱性析出氢氧化银，pH通常控制在 5.0~10.0
      33: 'C', // 测银用佛尔哈德法直接滴定（微酸性条件下以铁铵矾为指示剂，用NH4SCN滴定）
      34: 'B', // BaCl2不水解且pH中性，无干扰阴离子，可直接莫尔法测定
      35: 'A', // 浓HCl形成高离子强度产生显著盐效应，使BaSO4溶解度增大
      36: 'C', // 适当过量稀HCl利用同离子效应减少溶解度，过量浓HCl有配位和盐效应溶解
      37: 'C', // NH4Cl+NH3缓冲体系控制pH在沉淀Fe3+同时使Zn2+形成氨配合物不沉淀
      38: 'C', // 采用缓冲溶液缓慢沉淀
      39: 'C', // BaSO4晶形沉淀，冷水洗涤即可
      40: 'C', // 佛尔哈德法测Cl-加入过量AgNO3，再用NH4SCN返滴定过量的Ag+
      41: 'B', // 沉淀滴定两边浓度各增10倍，两端各拓展1个单位，突跃增大2个单位
      42: 'C', // 佛尔哈德法直接滴定Ag+采用标准滴定液为 NH4SCN
      43: 'C', // 湿灰分 5.88% = 干灰分 6.00% * (1 - 水分)，求得水分 = 2.00%
      44: 'C'  // MnS溶解度较大，S2-水解显碱性使酚酞变红；CuS溶解度极微水解可忽略显中性无色
    };

    // 全局状态
    let questions = [];
    let currentIndex = 0;
    let mode = 'practice';
    let currentFilter = 'all';
    
    // 本地存储状态
    let userAnswers = {};
    let starred = new Set();

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      parseRawQuestions();
      renderUI();
      bindShortcuts();
    });

    /**
     * 题库解析
     */
    function parseRawQuestions() {
      const rawText = document.getElementById('raw_q_text').textContent;
      const lines = rawText.split(/\r?\n/);
      
      questions = [];
      let currentQ = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        const qMatch = trimmed.match(/^(\d+)[\.、\s]+(.*)/);
        const optMatch = trimmed.match(/^([A-E])[\.、\s]+(.*)/);

        if (qMatch && !optMatch) {
          if (currentQ) questions.push(currentQ);
          currentQ = {
            id: parseInt(qMatch[1], 10),
            text: qMatch[2].trim(),
            options: [],
            correct: ansMap[parseInt(qMatch[1], 10)] || ''
          };
        } else if (optMatch && currentQ) {
          currentQ.options.push({
            key: optMatch[1],
            text: optMatch[2].trim()
          });
        } else if (currentQ) {
          if (currentQ.options.length === 0) {
            currentQ.text += '<br>' + trimmed;
          } else {
            currentQ.options[currentQ.options.length - 1].text += ' ' + trimmed;
          }
        }
      }

      if (currentQ) questions.push(currentQ);
    }

    /**
     * 本地存储处理
     */
    function loadStorage() {
      try {
        const savedAns = localStorage.getItem('anal_chem_precip_v1');
        if (savedAns) userAnswers = JSON.parse(savedAns);
        const savedStars = localStorage.getItem('anal_chem_precip_stars_v1');
        if (savedStars) starred = new Set(JSON.parse(savedStars));
      } catch (e) {
        console.error('Storage access error', e);
      }
    }

    function saveStorage() {
      localStorage.setItem('anal_chem_precip_v1', JSON.stringify(userAnswers));
      localStorage.setItem('anal_chem_precip_stars_v1', JSON.stringify(Array.from(starred)));
    }

    function resetProgress() {
      if (confirm('确定要清空第五单元全部 44 题的答题记录和收藏吗？')) {
        userAnswers = {};
        starred.clear();
        saveStorage();
        renderUI();
      }
    }

    /**
     * UI 渲染主流程
     */
    function renderUI() {
      if (questions.length === 0) return;
      const q = questions[currentIndex];

      document.getElementById('qMeta').innerText = `单选题 第 ${q.id} / ${questions.length} 题`;
      document.getElementById('qText').innerHTML = q.text;

      const starBtn = document.getElementById('starBtn');
      if (starred.has(q.id)) {
        starBtn.classList.add('starred');
      } else {
        starBtn.classList.remove('starred');
      }

      const optContainer = document.getElementById('optionsContainer');
      optContainer.innerHTML = '';

      const userChoice = userAnswers[q.id];
      const isAnswered = !!userChoice;

      q.options.forEach(opt => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option-item';
        
        if (mode === 'practice' && isAnswered) {
          if (opt.key === q.correct) {
            optDiv.classList.add('correct');
          } else if (opt.key === userChoice) {
            optDiv.classList.add('wrong');
          }
        } else if (mode === 'exam' && userChoice === opt.key) {
          optDiv.classList.add('selected');
        }

        optDiv.onclick = () => selectOption(opt.key);

        optDiv.innerHTML = `
          <div class="option-key">${opt.key}</div>
          <div class="option-text">${opt.text}</div>
        `;
        optContainer.appendChild(optDiv);
      });

      const banner = document.getElementById('resultBanner');
      if (mode === 'practice' && isAnswered) {
        banner.className = 'result-banner show ' + (userChoice === q.correct ? 'correct-banner' : 'wrong-banner');
        banner.innerHTML = userChoice === q.correct 
          ? `🎉 回答正确！标准答案：<b>${q.correct}</b>` 
          : `❌ 回答错误。你的选择：<b>${userChoice}</b>，标准答案：<b>${q.correct}</b>`;
      } else {
        banner.className = 'result-banner';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === questions.length - 1);

      updateStatsAndCard();

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([document.querySelector('.question-pane')]);
      }
    }

    function selectOption(key) {
      const q = questions[currentIndex];
      userAnswers[q.id] = key;
      saveStorage();
      renderUI();
    }

    function toggleStar() {
      const q = questions[currentIndex];
      if (starred.has(q.id)) {
        starred.delete(q.id);
      } else {
        starred.add(q.id);
      }
      saveStorage();
      renderUI();
    }

    function navigate(delta) {
      const nextIdx = currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIndex = nextIdx;
        renderUI();
      }
    }

    function jumpTo(index) {
      currentIndex = index;
      renderUI();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('modeExam').classList.toggle('active', mode === 'exam');
      renderUI();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      updateStatsAndCard();
    }

    function updateStatsAndCard() {
      let doneCount = 0;
      let correctCount = 0;

      questions.forEach(q => {
        if (userAnswers[q.id]) {
          doneCount++;
          if (userAnswers[q.id] === q.correct) correctCount++;
        }
      });

      document.getElementById('statDone').innerText = `${doneCount}/${questions.length}`;
      document.getElementById('statStar').innerText = starred.size;
      const rate = doneCount === 0 ? 0 : Math.round((correctCount / doneCount) * 100);
      document.getElementById('statRate').innerText = `${rate}%`;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const uAns = userAnswers[q.id];
        const isWrong = uAns && uAns !== q.correct;
        const isStar = starred.has(q.id);

        if (currentFilter === 'wrong' && !isWrong) return;
        if (currentFilter === 'star' && !isStar) return;

        const item = document.createElement('div');
        item.className = 'card-item';
        if (idx === currentIndex) item.classList.add('active');

        if (mode === 'practice') {
          if (uAns) {
            item.classList.add(uAns === q.correct ? 'correct' : 'wrong');
          }
        } else {
          if (uAns) item.classList.add('answered-exam');
        }

        item.innerText = q.id;
        if (isStar) {
          const starIcon = document.createElement('span');
          starIcon.className = 'star-dot';
          starIcon.innerText = '★';
          item.appendChild(starIcon);
        }

        item.onclick = () => jumpTo(idx);
        grid.appendChild(item);
      });
    }

    function bindShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D', 'E'].includes(key)) {
          selectOption(key);
        } else if (e.key === 'ArrowLeft') {
          navigate(-1);
        } else if (e.key === 'ArrowRight') {
          navigate(1);
        }
      });
    }
  </script>
