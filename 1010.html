  <script type="text/plain" id="raw_q_text">
1. 将下列氧化物按酸碱性分类：$\mathrm{Na_2O}$、$\mathrm{BaO}$、$\mathrm{ZnO}$、$\mathrm{MnO_2}$、$\mathrm{Cr_2O_3}$、$\mathrm{CrO_3}$、$\mathrm{CO}$、$\mathrm{CO_2}$、$\mathrm{N_2O}$、$\mathrm{NO_2}$、$\mathrm{SiO_2}$、$\mathrm{SO_3}$。(1) 属于酸性氧化物的是______；(2) 属于碱性氧化物的是______；(3) 属于两性氧化物的是______；(4) 既非酸性也非碱性氧化物的是______。
2. 比较 $\mathrm{O_3}$ 和 $\mathrm{O_2}$ 的性质：极性：$\mathrm{O_3}$______$\mathrm{O_2}$；沸点：$\mathrm{O_3}$______$\mathrm{O_2}$；稳定性：$\mathrm{O_3}$______$\mathrm{O_2}$；氧化性：$\mathrm{O_3}$______$\mathrm{O_2}$。
3. 在 $\mathrm{O_3}$、$\mathrm{O_2}$ 和 $\mathrm{H_2O_2}$ 分子中，$\mathrm{O-O}$ 间的键能次序为______ > ______ > ______。
4. 在 $\mathrm{ZnS}$、$\mathrm{CuS}$、$\mathrm{MnS}$、$\mathrm{SnS}$、$\mathrm{HgS}$ 中，易溶于稀盐酸的是______；不溶于稀盐酸，但溶于浓盐酸的是______；不溶于浓盐酸，但可溶于硝酸的是______；不溶于硝酸，可溶于王水的是______。
5. 将少量 $\mathrm{H_2S}$ 通入溴水溶液中，$\mathrm{H_2S}$ 的氧化产物为______。
6. 给出端氧与中心原子间的键级：$\mathrm{SO_2}$______，$\mathrm{SO_3}$______，$\mathrm{O_2}$______，$\mathrm{O_3}$______。
7. 给出下列分子中心原子 $\mathrm{S}$ 的轨道杂化类型：$\mathrm{SO_2}$______，$\mathrm{SO_3}$______，$(\mathrm{SO_3})_3$______，$\mathrm{H_2SO_3}$______，$\mathrm{H_2SO_4}$______，$\mathrm{H_2S_2O_3}$______，$\mathrm{SOCl_2}$______，$\mathrm{SO_2Cl_2}$______，$\mathrm{SCl_4}$______，$\mathrm{SF_6}$______。
8. 若欲除去 $\mathrm{CO_2}$ 中混有的少量 $\mathrm{SO_2}$ 气体，可将此混合气体通过饱和的______溶液或由稀硫酸酸化的______溶液。
9. $\mathrm{SOF_2}$、$\mathrm{SOCl_2}$、$\mathrm{SOBr_2}$ 的空间构型均为______；将它们按照 $\mathrm{S-O}$ 键的键长由小到大排列的顺序为______。
10. 硫酸熔沸点高的原因是______；浓硫酸有很强的吸水性和脱水性是因为______；浓硫酸有很强的氧化性是因为______。
11. 硫的含氧酸盐 $\mathrm{K_2S_2O_7}$、$\mathrm{Na_2S_2O_4}$、$\mathrm{K_2S_2O_8}$、$\mathrm{Na_2S_2O_3}$、$\mathrm{Na_2SO_3}$、$\mathrm{Na_2S_4O_6}$，其中属于连硫酸盐的是______；属于过硫酸盐的是______；属于焦硫酸盐的是______；酸性介质中氧化性最强的是______；还原性最强的是______。
12. 将 $a\ \mathrm{mol}\ \mathrm{Na_2SO_3}$ 和 $b\ \mathrm{mol}\ \mathrm{Na_2S}$ 混合后溶于水，再用稀酸酸化（假设充分反应）。若 $a = 0.5b$，则反应产物为______；若 $a > 0.5b$，则反应产物为______；若 $a < 0.5b$，则反应产物为______。
13. 给出下列物质的化学式：芒硝______，海波______，保险粉______，皓矾______。
14. 给出下列硫酸盐的化学式：泻盐______，莫尔盐______，明矾______，铁铵矾______，石膏______，绿矾______，胆矾______。
15. 某澄清的溶液中可能含有 $\mathrm{S^{2-}}$、$\mathrm{SO_3^{2-}}$、$\mathrm{S_2O_3^{2-}}$，向该溶液中滴加酸，只嗅到臭鸡蛋气味而未见浑浊，由此可以推测：溶液中存在______，不存在______，不能确定是否存在______。
16. 为使已变暗的古油画恢复原来的白色，可以用______溶液小心擦洗。
17. 比较化合物热稳定性（用“>”或“<”填空）：$\mathrm{H_2SO_3}$______$\mathrm{Na_2SO_3}$；$\mathrm{K_2SO_3}$______$\mathrm{Na_2SO_3}$；$\mathrm{Li_2O_2}$______$\mathrm{K_2O_2}$；$\mathrm{Fe_2S_3}$______$\mathrm{ZnS}$。
18. 给出下列盐中阴离子的结构特征（化学式/骨架）：$\mathrm{Na_2S_2O_3}$______，$\mathrm{Na_2S_2O_4}$______，$\mathrm{K_2S_2O_8}$______，$\mathrm{K_2S_3O_6}$______，$\mathrm{K_2S_2O_7}$______，$\mathrm{Na_2S_2O_5}$______。
19. 给出下列化合物的颜色：$\mathrm{Ag_2S_2O_3}$______，$\mathrm{PbS_2O_3}$______，$\mathrm{PbSO_4}$______，$\mathrm{SnS_2}$______，$\mathrm{MnS}$______，$\mathrm{ZnS}$______，$\mathrm{As_2S_3}$______，$\mathrm{As_2S_5}$______，$\mathrm{Sb_2S_3}$______，$\mathrm{Sb_2S_5}$______。
20. 在 $\mathrm{S_2O_3^{2-}}$ 中 $\mathrm{S}$ 可能表现出多种氧化态。若用一个反应的产物来表现其中 $\mathrm{S}$ 的多种氧化态，该反应是______。
21. 给出下列矿物或物质的化学式：(1) 方铅矿______；(2) 朱砂______；(3) 闪锌矿______；(4) 黄铜矿______；(5) 黄铁矿______；(6) 芒硝______；(7) 海波______；(8) 保险粉______。
22. 比较大小：(1) 氧化性：$\mathrm{O_3}$______$\mathrm{O_2}$，$\mathrm{O_2}$______$\mathrm{H_2O_2}$，$\mathrm{SO_3}$______$\mathrm{SO_2}$；(2) 稳定性：$\mathrm{O_3}$______$\mathrm{O_2}$，$\mathrm{SO_2}$______$\mathrm{SO_3}$，$\mathrm{Na_2SO_3}$______$\mathrm{Na_2S_2O_3}$。
23. 现有化合物 $\mathrm{KO_2}$、$\mathrm{K_2O_2}$、$\mathrm{K_2O}$、$\mathrm{O_2[PtF_6]}$，按 $\mathrm{O-O}$ 键长增加顺序排列为______。
24. 给出下列离子的结构式或特征骨架：硫代硫酸根______；过二硫酸根______；连二亚硫酸根______；连四硫酸根______。
25. 向各离子浓度均为 $0.1\ \mathrm{mol\cdot dm^{-3}}$ 的 $\mathrm{Mn}^{2+}$、$\mathrm{Zn}^{2+}$、$\mathrm{Cu}^{2+}$、$\mathrm{Ag}^+$、$\mathrm{Hg}^{2+}$、$\mathrm{Pb}^{2+}$ 混合溶液中通入 $\mathrm{H_2S}$ 气体，在酸性介质中可被沉淀的离子有______。
26. 若除去氢气中少量的 $\mathrm{SO_2}$、$\mathrm{H_2S}$ 和水蒸气，应将氢气先通过______溶液，再通过______。
27. 硫化物 $\mathrm{ZnS}$、$\mathrm{CuS}$、$\mathrm{MnS}$、$\mathrm{SnS}$、$\mathrm{HgS}$ 中，易溶于稀盐酸的是______；不溶于稀盐酸但溶于浓盐酸的是______；不溶于浓盐酸但可溶于硝酸的是______；只溶于王水的是______。
28. $\mathrm{AgNO_3}$ 溶液与过量的 $\mathrm{Na_2S_2O_3}$ 溶液反应生成______色的______；过量的 $\mathrm{AgNO_3}$ 溶液与 $\mathrm{Na_2S_2O_3}$ 溶液反应生成______色的______，后变为______色的______。
29. $\mathrm{NaHSO_3}$ 受热分解产物为______；$\mathrm{Na_2S_2O_3}$ 受热分解产物为______；$\mathrm{Na_2S_2O_4}$ 受热分解产物为______。
30. $\mathrm{H_2S}$ 水溶液长期放置后变混浊，原因是______。
31. 酸化某溶液析出 $\mathrm{S}$ 并放出 $\mathrm{SO_2}$，则原溶液中的含硫化合物可能为______或______。
32. 比较组成为 $\mathrm{M_2S_2O_x}$ 的三种盐，将性质序号填入横栏：(1) $\mathrm{M_2S_2O_3}$：$x=$______，符合性质序号______；(2) $\mathrm{M_2S_2O_7}$：$x=$______，符合性质序号______；(3) $\mathrm{M_2S_2O_8}$：$x=$______，符合性质序号______。（性质：①阴离子含过氧键 ②含S-S键 ③由硫酸氢盐脱水缩合 ④由硫酸氢盐阳极氧化 ⑤使AgBr溶解 ⑥将Mn2+氧化为MnO4-）
33. 给出下列化合物的颜色：$\mathrm{ZnS}$______色；$\mathrm{MnS}$______色；$\mathrm{CdS}$______色；$\mathrm{SnS}$______色；$\mathrm{As_2S_3}$______色；$\mathrm{As_2S_5}$______色；$\mathrm{Sb_2S_3}$______色；$\mathrm{Sb_2S_5}$______色；$\mathrm{Ag_2S_2O_3}$______色；$\mathrm{PbS_2O_3}$______色。

      33: [
        ["白"], ["肉红", "肉色"], ["黄", "金黄"], ["暗褐", "黑褐"], ["鲜黄", "黄"],
        ["淡黄", "浅黄"], ["橙红", "黑"], ["橙", "橙黄"], ["白变黑", "白"], ["白"]

    let questions = [];
    let currentIndex = 0;
    let examMode = 'realtime';
    let currentFilter = 'all';
    
    let userData = {
      answers: {},
      submitted: {},
      starred: {},
      evalResults: {}
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      parseRawQuestions();
      renderSidebar();
      renderCard(currentIndex);
      updateStats();

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') prevQuestion();
        if (e.key === 'ArrowRight') nextQuestion();
      });
    });

    function parseRawQuestions() {
      const raw = document.getElementById('raw_q_text').innerText.trim();
      const lines = raw.split('\n').filter(l => l.trim().length > 0);
      
      questions = lines.map((line, idx) => {
        const id = idx + 1;
        let text = line.replace(/^\d+[\.、\s]+/, '').trim();
        let source = id <= 20 ? "考研指导 第十一章 (氧族)" : "例题与习题 第十六章 (氧族)";

        return {
          id: id,
          title: `第 ${id} 题`,
          source: source,
          rawText: text,
          ansList: ansMap[id] || []
        };
      });
    }

    function renderCard(index) {
      if (index < 0 || index >= questions.length) return;
      currentIndex = index;
      const q = questions[currentIndex];
      
      document.getElementById('q-source-badge').innerText = `[${q.source}] 题号 ${q.id}`;
      document.getElementById('q-index-badge').innerText = `${currentIndex + 1} / ${questions.length}`;
      
      const starBtn = document.getElementById('star-btn');
      starBtn.className = 'star-btn' + (userData.starred[q.id] ? ' active' : '');

      const contentBox = document.getElementById('q-content-box');
      const savedAns = userData.answers[q.id] || [];
      
      let blankIdx = 0;
      let html = q.rawText.replace(/_{2,}/g, () => {
        const val = savedAns[blankIdx] || '';
        const bId = `blank-${q.id}-${blankIdx}`;
        const inputHtml = `<input type="text" id="${bId}" class="fill-blank" value="${escapeHtml(val)}" 
          data-blank-idx="${blankIdx}" onblur="onInputBlur(${q.id}, ${blankIdx})" onkeydown="handleInputKey(event, ${q.id}, ${blankIdx})" autocomplete="off" />`;
        blankIdx++;
        return inputHtml;
      });

      contentBox.innerHTML = html;

      const ansBox = document.getElementById('ans-box');
      const ansContent = document.getElementById('ans-content');
      
      if (examMode === 'realtime' && userData.submitted[q.id]) {
        renderAnswerBox(q, ansBox, ansContent);
        applyBlankStyles(q);
      } else {
        ansBox.className = 'ans-box';
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([contentBox, ansBox]);
      }

      updateSidebarHighlight();
    }

    function normalizeStr(str) {
      if (!str) return '';
      return str
        .trim()
        .toLowerCase()
        .replace(/[\uff01-\uff5e]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
        .replace(/\s+/g, '')
        .replace(/[，、]/g, ',');
    }

    function checkAnswerCorrect(userVal, acceptedList) {
      if (!acceptedList || acceptedList.length === 0) return true;
      const normUser = normalizeStr(userVal);
      if (!normUser) return false;
      return acceptedList.some(item => normalizeStr(item) === normUser);
    }

    function onInputBlur(qId, bIdx) {
      const input = document.getElementById(`blank-${qId}-${bIdx}`);
      if (!input) return;
      if (!userData.answers[qId]) userData.answers[qId] = [];
      userData.answers[qId][bIdx] = input.value;
      saveStorage();
      updateStats();

      if (examMode === 'realtime' && userData.submitted[qId]) {
        applyBlankStyles(questions.find(q => q.id === qId));
      }
    }

    function handleInputKey(e, qId, bIdx) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const nextInput = document.getElementById(`blank-${qId}-${bIdx + 1}`);
        if (nextInput) {
          nextInput.focus();
        } else {
          checkCurrentAnswer();
        }
      }
    }

    function checkCurrentAnswer() {
      const q = questions[currentIndex];
      const inputs = document.querySelectorAll('#q-content-box .fill-blank');
      
      if (!userData.answers[q.id]) userData.answers[q.id] = [];
      inputs.forEach((input, i) => {
        userData.answers[q.id][i] = input.value;
      });

      userData.submitted[q.id] = true;

      let allCorrect = true;
      q.ansList.forEach((accepted, idx) => {
        const uVal = userData.answers[q.id][idx] || '';
        if (!checkAnswerCorrect(uVal, accepted)) {
          allCorrect = false;
        }
      });
      userData.evalResults[q.id] = allCorrect;

      saveStorage();
      updateStats();
      renderSidebar();

      if (examMode === 'realtime') {
        const ansBox = document.getElementById('ans-box');
        const ansContent = document.getElementById('ans-content');
        renderAnswerBox(q, ansBox, ansContent);
        applyBlankStyles(q);
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([ansBox]);
        }
      } else {
        alert('作答已记录！在模拟考试模式下交卷后统一核对结果。');
      }
    }

    function applyBlankStyles(q) {
      const inputs = document.querySelectorAll('#q-content-box .fill-blank');
      inputs.forEach((input, idx) => {
        const accepted = q.ansList[idx] || [];
        const isOk = checkAnswerCorrect(input.value, accepted);
        input.className = 'fill-blank ' + (isOk ? 'correct' : 'wrong');
      });
    }

    function renderAnswerBox(q, box, contentEl) {
      box.className = 'ans-box show';
      let html = '<ol style="padding-left: 20px; margin-top: 4px;">';
      q.ansList.forEach((ansGroup, i) => {
        html += `<li>空 ${i + 1}：<b>${escapeHtml(ansGroup[0])}</b> ${ansGroup.length > 1 ? `<span style="color:#64748b;font-size:0.85rem;">(等价表达: ${ansGroup.slice(1).join(' / ')})</span>` : ''}</li>`;
      });
      html += '</ol>';
      contentEl.innerHTML = html;
    }

    function toggleMode() {
      examMode = examMode === 'realtime' ? 'mock' : 'realtime';
      document.getElementById('mode-toggle-btn').innerText = examMode === 'realtime' ? '模式：实时练习' : '模式：模拟考试';
      renderCard(currentIndex);
      renderSidebar();
    }

    function toggleCurrentStar() {
      const q = questions[currentIndex];
      userData.starred[q.id] = !userData.starred[q.id];
      saveStorage();
      updateStats();
      renderCard(currentIndex);
      renderSidebar();
    }

    function prevQuestion() {
      if (currentIndex > 0) renderCard(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) renderCard(currentIndex + 1);
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderSidebar();
    }

    function renderSidebar() {
      const grid = document.getElementById('sheet-grid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const isSubmitted = userData.submitted[q.id];
        const isCorrect = userData.evalResults[q.id];
        const isStarred = userData.starred[q.id];

        if (currentFilter === 'wrong' && (!isSubmitted || isCorrect)) return;
        if (currentFilter === 'starred' && !isStarred) return;

        const item = document.createElement('div');
        item.className = 'sheet-item';
        item.innerText = q.id;

        if (examMode === 'realtime') {
          if (isSubmitted) {
            item.classList.add(isCorrect ? 'correct' : 'wrong');
          }
        } else {
          if (isSubmitted) item.classList.add('done-mock');
        }

        if (idx === currentIndex) item.classList.add('current');

        item.onclick = () => renderCard(idx);
        grid.appendChild(item);
      });
    }

    function updateSidebarHighlight() {
      const items = document.querySelectorAll('.sheet-item');
      items.forEach(it => {
        if (parseInt(it.innerText) === questions[currentIndex].id) {
          it.classList.add('current');
        } else {
          it.classList.remove('current');
        }
      });
    }

    function updateStats() {
      const total = questions.length;
      let doneCount = 0;
      let correctCount = 0;
      let starCount = 0;

      questions.forEach(q => {
        if (userData.submitted[q.id]) {
          doneCount++;
          if (userData.evalResults[q.id]) correctCount++;
        }
        if (userData.starred[q.id]) starCount++;
      });

      document.getElementById('stat-done').innerText = `${doneCount}/${total}`;
      document.getElementById('stat-rate').innerText = doneCount === 0 ? '0%' : `${Math.round((correctCount / doneCount) * 100)}%`;
      document.getElementById('stat-starred').innerText = starCount;
    }

    function saveStorage() {
      localStorage.setItem('inorganic_chem_unit6_progress', JSON.stringify(userData));
    }

    function loadStorage() {
      const data = localStorage.getItem('inorganic_chem_unit6_progress');
      if (data) {
        try {
          userData = JSON.parse(data);
        } catch (e) {
          console.error("加载存档失败:", e);
        }
      }
    }

    function resetAllProgress() {
      if (confirm("确定要清空第六单元的所有做题记录和收藏状态吗？")) {
        localStorage.removeItem('inorganic_chem_unit6_progress');
        userData = { answers: {}, submitted: {}, starred: {}, evalResults: {} };
        renderCard(0);
        renderSidebar();
        updateStats();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
