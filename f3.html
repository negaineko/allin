  <!-- 纯文本题库插槽 (第三单元：络合滴定法选择题 1~16) -->
  <script type="text/plain" id="raw_q_text">
1. 以 EDTA滴定相同浓度的金属离子M, 已知滴定终点时 $\Delta pM'=0.20, K'_{MY}=10^{7.0}$。若要求终点误差为0.1%, 则被测金属离子M的最低起始浓度为( )
A. 0.10 mol/L
B. 0.20 mol/L
C. 0.010 mol/L
D. 0.020 mol/L

2. 在一定酸度下, 用EDTA滴定金属离子M。当溶液中存在干扰离子N时, 影响络合剂总副反应系数大小的因素是( )
A. $\alpha_{Y(H)}$
B. $\alpha_{Y(H)} + \alpha_{Y(N)}$
C. $\alpha_{Y(N)}$
D. $K_{MY}/K_{NY}$

3. 在下列两种情况下, 以EDTA滴定相同浓度的 $Zn^{2+}$: 一是在 $pH=10.0$ 的氨性缓冲溶液中; 二是在 $pH=5.5$ 的六亚甲基四胺缓冲溶液中。叙述滴定曲线pZn突跃范围大小正确的是( )
A. 突跃范围大小相同
B. 前者的pZn突跃范围比后者大
C. 前者的pZn突跃范围比后者小
D. 上述三种情况都有可能

4. 含 $Ca^{2+}$、$Mg^{2+}$ 的混合溶液用EDTA法测定 $Ca^{2+}$ 时, 要消除 $Mg^{2+}$ 的干扰, 宜用( )
A. 控制酸度法
B. 配位掩蔽法
C. 氧化还原掩蔽法
D. 沉淀掩蔽法

5. 已知 EDTA 的 $pK_{a_1}\sim pK_{a_6}$ 分别为0.9, 1.6, 2.0, 2.67, 6.16, 10.26。现在 $pH>12$ 的碱性溶液中, 以EDTA滴定等浓度的 $Ca^{2+}$, 已知在此条件下 $Ca^{2+}$ 不发生副反应。下列叙述正确的是( )
A. 滴定至50%时, $pCa=pY$
B. 滴定至化学计量点时, $pCa=pY$
C. 滴定至150%时, $pCa=pY$
D. 上述三种叙述均不正确

6. 在 $pH=10.0$ 的氨性缓冲溶液中, 以 $0.020\text{ mol/L}$ EDTA滴定相同浓度的 $Zn^{2+}$, 已知 $\lg K_{ZnY}=16.5, \lg\alpha_{Y(H)}=0.5, \lg\alpha_{Zn(NH_3)}=5.0, \lg\alpha_{Zn(OH)}=2.4$, 则化学计量点时 $pZn'$ 值为( )
A. 6.5
B. 8.0
C. 11.5
D. 10.0

7. 今有两份相同浓度的 $Zn^{2+}$ 溶液, 分别为 $pH=10.0$ 的氨性缓冲溶液和 $pH=5.5$ 的六亚甲基四胺缓冲溶液。对pZn值的大小叙述正确的是( )
A. pZn值相等
B. 前者的pZn值大于后者的pZn值
C. 前者的pZn值小于后者的pZn值
D. 上述三种情况均不正确

8. 在 $pH=5.5$ 的六亚甲基四胺缓冲溶液中, 用EDTA滴定 $Zn^{2+}$ 至化学计量点时, 以下关系正确的是( )
A. $[Zn^{2+}]=[Y^{4-}]$
B. $[Zn^{2+}]=[Y']$
C. $[Y^{4-}]=[ZnY]/K'_{ZnY}$
D. $c_Y=[MY]$

9. 用EDTA 滴定金属离子时, 若EDTA和金属离子的浓度均增大10倍, pM突跃改变( )
A. 1个单位
B. 2个单位
C. 10个单位
D. 不变化

10. 在EDTA滴定法中, 下列叙述正确的是( )
A. 酸效应系数越大, 配合物的稳定性越大
B. 酸效应系数越小, 配合物的稳定性越大
C. pH值越大, 酸效应系数越大
D. 酸效应系数越大, 络合滴定曲线的pM突跃范围越大

11. 配位滴定中采用返滴定法测定 $Al^{3+}$ 原因是( )
A. 反应速度慢
B. $Al^{3+}$ 封闭二甲酚橙
C. 原因包括A和B
D. 全不对

12. 配位滴定中, 金属指示剂的封闭现象是由于( )
A. $K_{MY} < K_{MIn}$
B. $K_{MY} = K_{MIn}$
C. $K_{MY} > K_{MIn}$
D. $K_{MY} \ne K_{MIn}$

13. 用EDTA测定 $Mg^{2+}$, $Al^{3+}$ 有干扰时, 常用的消除方法是( )
A. 溶剂萃取
B. 使溶液的pH值偏碱性
C. 加入三乙醇胺
D. 加入 $F^-$

14. 以下表述正确的是( )
A. 二甲酚橙指示剂的理论变色点是一定值
B. 用EDTA 直接滴定 $Al^{3+}$ 时, 可以用二甲酚橙作指示剂
C. 二甲酚橙指示剂既适用于酸性溶液, 也适用于弱碱性溶液
D. 二甲酚橙指示剂的滴定终点与金属离子的副反应有关

15. 用EDTA直接滴定有色金属离子M, 终点所呈现的颜色是( )
A. 游离指示剂的颜色
B. EDTA-M配合物的颜色
C. 指示剂-M配合物的颜色
D. 上述 A+B 的混合色

16. 在非缓冲溶液中用EDTA滴定金属离子时, 溶液的pH将( )
A. 增大
B. 降低
C. 不变
D. 不能确定

17. 在无配位效应发生时, 下列有关条件稳定常数的叙述正确的是( )
A. 酸效应系数越大, 条件稳定常数越大
B. 配合物的条件稳定常数总是大于其稳定常数
C. 溶液的pH值越低, 条件稳定常数越小
D. 配位滴定曲线的pM突跃大小与条件稳定常数无关
  </script>

  <script>
        /**
     * 第二单元 标准答案映射表
     */
       const ansMap = {
      1: 'D',  // 由林邦误差公式 TE = (10^ΔpM' - 10^-ΔpM') / sqrt(c_sp * K')，可求得起始浓度约为 0.020 mol/L
      2: 'B',  // 络合剂的总副反应系数为各副反应系数之和减去重复项，近似为 α_Y = α_Y(H) + α_Y(N) - 1
      3: 'C',  // pH=10时由于氨的配位副反应显著，Zn的条件稳定常数及突跃变小
      4: 'D',  // 调至 pH>12 使 Mg2+ 沉淀为 Mg(OH)2 沉淀掩蔽
      5: 'B',  // 化学计量点时游离的金属与游离EDTA总浓度相等，且均未发生副反应，故 pCa = pY
      6: 'A',  // lgK'_ZnY = 16.5 - 0.5 - 5.0 = 11.0; sp时 c_Zn' = sqrt(c_sp / K')，算得 pZn' = 6.5
      7: 'B',  // pH=10时存在氨配合副反应，游离Zn2+浓度更小，pZn更大
      8: 'B',  // 此时Zn2+主要未被络合（无明显辅助络合剂），化学计量点 [Zn2+] = [Y']
      9: 'A',  // 浓度增大10倍，突跃的起始端点下移1个单位，突跃增大1个单位
      10: 'B', // 酸效应系数越小，表示副反应越小，条件稳定常数越大、配合物越稳定
      11: 'C', // Al3+与EDTA配位慢，且对指示剂二甲酚橙有严重封闭作用，故用返滴定法
      12: 'A', // K_MIn > K_MY 时指示剂无法被EDTA置换出来，导致封闭
      13: 'C', // 加入三乙醇胺掩蔽 Al3+，常用于测定 Ca2+、Mg2+
      14: 'D', // 变色点 pM_t 取决于指示剂的条件稳定常数，与副反应紧密相关
      15: 'D', // 终点为完全游离的指示剂颜色与生成的有色金属配合物颜色的混合色
      16: 'B', // EDTA释放出 H+ (如 H2Y2- + M2+ -> MY2- + 2H+)，导致溶液 pH 降低
      17: 'C'  // pH越低，α_Y(H)越大，条件稳定常数 K' = K / α 越小
    };


    // 全局状态
    let questions = [];
    let currentIndex = 0;
    let mode = 'practice'; // 'practice' | 'exam'
    let currentFilter = 'all'; // 'all' | 'wrong' | 'star'
    
    // 持久化状态
    let userAnswers = {};
    let starred = new Set();

    // 初始化加载
    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      parseRawQuestions();
      renderUI();
      bindShortcuts();
    });

    /**
     * 1. 题库解析逻辑 (逐行解析避免空行切片)
     */
    function parseRawQuestions() {
      const rawText = document.getElementById('raw_q_text').textContent;
      const lines = rawText.split(/\r?\n/);
      
      questions = [];
      let currentQ = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        const qMatch = trimmed.match(/^(\d+)[\.、\s]+(.*)/);
        const optMatch = trimmed.match(/^([A-E])[\.、\s]+(.*)/);

        if (qMatch && !optMatch) {
          if (currentQ) questions.push(currentQ);
          currentQ = {
            id: parseInt(qMatch[1], 10),
            text: qMatch[2].trim(),
            options: [],
            correct: ansMap[parseInt(qMatch[1], 10)] || ''
          };
        } else if (optMatch && currentQ) {
          currentQ.options.push({
            key: optMatch[1],
            text: optMatch[2].trim()
          });
        } else if (currentQ) {
          if (currentQ.options.length === 0) {
            currentQ.text += '<br>' + trimmed;
          } else {
            currentQ.options[currentQ.options.length - 1].text += ' ' + trimmed;
          }
        }
      }

      if (currentQ) questions.push(currentQ);
    }

    /**
     * 2. 本地存储 (localStorage)
     */
    function loadStorage() {
      try {
        const savedAns = localStorage.getItem('anal_chem_answers_ch5');
        if (savedAns) userAnswers = JSON.parse(savedAns);
        const savedStars = localStorage.getItem('anal_chem_stars_ch5');
        if (savedStars) starred = new Set(JSON.parse(savedStars));
      } catch (e) {
        console.error('Storage access error', e);
      }
    }

    function saveStorage() {
      try {
        localStorage.setItem('anal_chem_answers_ch5', JSON.stringify(userAnswers));
        localStorage.setItem('anal_chem_stars_ch5', JSON.stringify(Array.from(starred)));
      } catch (e) {
        console.error('Storage save error', e);
      }
    }

    function resetProgress() {
      if (confirm('确定要清空本单元的所有答题记录和收藏吗？')) {
        userAnswers = {};
        starred.clear();
        saveStorage();
        renderUI();
      }
    }

    /**
     * 3. 渲染主流程
     */
    function renderUI() {
      if (questions.length === 0) return;
      const q = questions[currentIndex];

      document.getElementById('qMeta').innerText = `单选题 第 ${q.id} / ${questions.length} 题`;
      document.getElementById('qText').innerHTML = q.text;

      const starBtn = document.getElementById('starBtn');
      if (starred.has(q.id)) {
        starBtn.classList.add('starred');
      } else {
        starBtn.classList.remove('starred');
      }

      const optContainer = document.getElementById('optionsContainer');
      optContainer.innerHTML = '';

      const userChoice = userAnswers[q.id];
      const isAnswered = !!userChoice;

      q.options.forEach(opt => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option-item';
        
        if (mode === 'practice' && isAnswered) {
          if (opt.key === q.correct) {
            optDiv.classList.add('correct');
          } else if (opt.key === userChoice) {
            optDiv.classList.add('wrong');
          }
        } else if (mode === 'exam' && userChoice === opt.key) {
          optDiv.classList.add('selected');
        }

        optDiv.onclick = () => selectOption(opt.key);

        optDiv.innerHTML = `
          <div class="option-key">${opt.key}</div>
          <div class="option-text">${opt.text}</div>
        `;
        optContainer.appendChild(optDiv);
      });

      const banner = document.getElementById('resultBanner');
      if (mode === 'practice' && isAnswered) {
        banner.className = 'result-banner show ' + (userChoice === q.correct ? 'correct-banner' : 'wrong-banner');
        banner.innerHTML = userChoice === q.correct 
          ? `🎉 回答正确！标准答案：<b>${q.correct}</b>` 
          : `❌ 回答错误。你的选择：<b>${userChoice}</b>，标准答案：<b>${q.correct}</b>`;
      } else {
        banner.className = 'result-banner';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === questions.length - 1);

      updateStatsAndCard();

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([document.querySelector('.question-pane')]);
      }
    }

    /**
     * 4. 答题与操作
     */
    function selectOption(key) {
      const q = questions[currentIndex];
      userAnswers[q.id] = key;
      saveStorage();
      renderUI();
    }

    function toggleStar() {
      const q = questions[currentIndex];
      if (starred.has(q.id)) {
        starred.delete(q.id);
      } else {
        starred.add(q.id);
      }
      saveStorage();
      renderUI();
    }

    function navigate(delta) {
      const nextIdx = currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIndex = nextIdx;
        renderUI();
      }
    }

    function jumpTo(index) {
      currentIndex = index;
      renderUI();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('modeExam').classList.toggle('active', mode === 'exam');
      renderUI();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      updateStatsAndCard();
    }

    /**
     * 5. 统计与答题卡更新
     */
    function updateStatsAndCard() {
      let doneCount = 0;
      let correctCount = 0;

      questions.forEach(q => {
        if (userAnswers[q.id]) {
          doneCount++;
          if (userAnswers[q.id] === q.correct) correctCount++;
        }
      });

      document.getElementById('statDone').innerText = `${doneCount}/${questions.length}`;
      document.getElementById('statStar').innerText = starred.size;
      const rate = doneCount === 0 ? 0 : Math.round((correctCount / doneCount) * 100);
      document.getElementById('statRate').innerText = `${rate}%`;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const uAns = userAnswers[q.id];
        const isWrong = uAns && uAns !== q.correct;
        const isStar = starred.has(q.id);

        if (currentFilter === 'wrong' && !isWrong) return;
        if (currentFilter === 'star' && !isStar) return;

        const item = document.createElement('div');
        item.className = 'card-item';
        if (idx === currentIndex) item.classList.add('active');

        if (mode === 'practice') {
          if (uAns) {
            item.classList.add(uAns === q.correct ? 'correct' : 'wrong');
          }
        } else {
          if (uAns) item.classList.add('answered-exam');
        }

        item.innerText = q.id;
        if (isStar) {
          const starIcon = document.createElement('span');
          starIcon.className = 'star-dot';
          starIcon.innerText = '★';
          item.appendChild(starIcon);
        }

        item.onclick = () => jumpTo(idx);
        grid.appendChild(item);
      });
    }

        /**
     * 6. 快捷键监听
     */
    function bindShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D', 'E'].includes(key)) {
          selectOption(key);
        } else if (e.key === 'ArrowLeft') {
          navigate(-1);
        } else if (e.key === 'ArrowRight') {
          navigate(1);
        }
      });
    }
  </script>
</body>
</html>
