      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
      color: var(--primary);
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .action-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);

      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;

      flex-direction: column;

      padding: 24px;

      flex-direction: column;
      gap: 18px;

    .question-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .question-tag {
      background: #eff6ff;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;

      color: #94a3b8;

    }

    .question-text {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);
      white-space: pre-line;
      font-weight: 500;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background: var(--card-bg);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
      line-height: 1.5;
      transition: all 0.2s;
    }

    .option-btn:hover {
      border-color: #94a3b8;

    .option-btn.selected {

    .option-btn.correct {

      background: var(--success-bg);
      color: #15803d;
      font-weight: 600;

    .option-btn.wrong {

      background: var(--danger-bg);
      color: #b91c1c;
    }

      height: 24px;
      border-radius: 50%;
      background: #f1f5f9;
      font-weight: 700;
      font-size: 12px;
      flex-shrink: 0;
      color: #475569;
    }

      color: #fff;

      background: #f8fafc;
      border-left: 4px solid var(--primary);

      border-radius: 6px;
      font-size: 13.5px;

      font-weight: 600;

    .btn-secondary {
      background: #f1f5f9;
      color: #334155;

      background: #e2e8f0;

    let curIdx = 0;
    let userAnswers = JSON.parse(localStorage.getItem('jlu_phychem_ch4_ans')) || {};
    let userStars = JSON.parse(localStorage.getItem('jlu_phychem_ch4_stars')) || {};
    let currentFilter = 'all';
    let isExamMode = false;

    // DOM Elements
    const qIdxTag = document.getElementById('qIdxTag');
    const qText = document.getElementById('qText');
    const optList = document.getElementById('optList');
    const expBox = document.getElementById('expBox');
    const expContent = document.getElementById('expContent');
    const starBtn = document.getElementById('starBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const gridMatrix = document.getElementById('gridMatrix');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');

    function renderQuestion() {
      const item = quizData[curIdx];
      qIdxTag.innerText = `第 ${curIdx + 1} / 85 题`;
      qText.innerText = item.q;
      optList.innerHTML = '';
      expBox.style.display = 'none';

      starBtn.classList.toggle('starred', !!userStars[curIdx]);

      const answered = userAnswers[curIdx] !== undefined;
      const selectedOpt = userAnswers[curIdx];

      item.opts.forEach((opt, idx) => {
        const optBtn = document.createElement('div');
        optBtn.className = 'option-btn';
        const optCode = String.fromCharCode(65 + idx);
        
        optBtn.innerHTML = `<span class="opt-code">${optCode}</span><span>${opt}</span>`;

        if (answered) {
          if (!isExamMode) {
            if (idx === item.ans) optBtn.classList.add('correct');
            if (selectedOpt === idx && idx !== item.ans) optBtn.classList.add('wrong');
          } else {
            if (selectedOpt === idx) optBtn.classList.add('selected');
          }
        } else {
          optBtn.onclick = () => selectOption(idx);
        }

        optList.appendChild(optBtn);
      });

      if (answered && !isExamMode) {
        expContent.innerText = item.exp;
        expBox.style.display = 'block';
        submitBtn.style.display = 'none';
      } else {
        submitBtn.style.display = 'block';
      }

      renderGrid();
      updateStats();
    }

    function selectOption(optIdx) {
      userAnswers[curIdx] = optIdx;
      localStorage.setItem('jlu_phychem_ch4_ans', JSON.stringify(userAnswers));
      renderQuestion();
    }

    function renderGrid() {
      gridMatrix.innerHTML = '';
      quizData.forEach((item, idx) => {
        if (currentFilter === 'wrong' && !(userAnswers[idx] !== undefined && userAnswers[idx] !== item.ans)) return;
        if (currentFilter === 'starred' && !userStars[idx]) return;

        const gridItem = document.createElement('div');
        gridItem.className = 'grid-item';
        gridItem.innerText = idx + 1;

        if (idx === curIdx) gridItem.classList.add('current');
        if (userStars[idx]) gridItem.classList.add('starred');

        if (userAnswers[idx] !== undefined) {
          if (userAnswers[idx] === item.ans) {
            gridItem.classList.add('correct');
          } else {
            gridItem.classList.add('wrong');
          }
        }

        gridItem.onclick = () => {
          curIdx = idx;
          renderQuestion();
        };

        gridMatrix.appendChild(gridItem);
      });
    }

    function updateStats() {
      const answeredKeys = Object.keys(userAnswers);
      const completedCount = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        if (userAnswers[k] === quizData[k].ans) correctCount++;
      });

      const acc = completedCount > 0 ? Math.round((correctCount / completedCount) * 100) : 0;
      const starredCount = Object.keys(userStars).filter(k => userStars[k]).length;

      document.getElementById('statCompleted').innerText = completedCount;
      document.getElementById('statAccuracy').innerText = acc + '%';
      document.getElementById('statStarred').innerText = starredCount;
    }

    starBtn.onclick = () => {
      userStars[curIdx] = !userStars[curIdx];
      localStorage.setItem('jlu_phychem_ch4_stars', JSON.stringify(userStars));
      renderQuestion();
    };

    prevBtn.onclick = () => {
      if (curIdx > 0) {
        curIdx--;
        renderQuestion();
      }
    };

    nextBtn.onclick = () => {
      if (curIdx < quizData.length - 1) {
        curIdx++;
        renderQuestion();
      }
    };

    modeToggleBtn.onclick = () => {
      isExamMode = !isExamMode;
      modeToggleBtn.innerText = isExamMode ? "模式: 模拟考试" : "模式: 实时练习";
      renderQuestion();
    };

    resetAllBtn.onclick = () => {
      if (window.confirm("确定要清空第四单元所有的刷题记录与收藏吗？")) {
        userAnswers = {};
        userStars = {};
        localStorage.removeItem('jlu_phychem_ch4_ans');
        localStorage.removeItem('jlu_phychem_ch4_stars');
        curIdx = 0;
        renderQuestion();
      }
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderGrid();
      };
    });

    // Initialize App
    renderQuestion();
  </script>
