<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>化学考研刷题系统 - 总入口</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            
            /* 物理化学 - 紫色调 */
            --wh-color: #8b5cf6;
            --wh-light: #f5f3ff;
            
            /* 无机化学 - 蓝色调 */
            --wj-color: #2563eb;
            --wj-light: #eff6ff;
            
            /* 分析化学 - 绿色调 */
            --fx-color: #059669;
            --fx-light: #ecfdf5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1080px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 28px;
            color: #0f172a;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            color: var(--text-sub);
            font-size: 15px;
        }

        /* 三栏自适应网格 */
        .portal-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .portal-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 36px 24px;
            text-decoration: none;
            color: inherit;
            border: 2px solid transparent;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.04);
            transition: all 0.25s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .portal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.08);
        }

        .wh-card:hover { border-color: var(--wh-color); }
        .wj-card:hover { border-color: var(--wj-color); }
        .fx-card:hover { border-color: var(--fx-color); }

        .icon-box {
            width: 68px;
            height: 68px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .wh-card .icon-box { background-color: var(--wh-light); }
        .wj-card .icon-box { background-color: var(--wj-light); }
        .fx-card .icon-box { background-color: var(--fx-light); }

        .portal-card h2 {
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .portal-card .desc {
            font-size: 14px;
            color: var(--text-sub);
            line-height: 1.5;
            margin-bottom: 28px;
            min-height: 42px;
        }

        .btn {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
        }

        .wh-card .btn { background-color: var(--wh-light); color: var(--wh-color); }
        .wh-card:hover .btn { background-color: var(--wh-color); color: #ffffff; }

        .wj-card .btn { background-color: var(--wj-light); color: var(--wj-color); }
        .wj-card:hover .btn { background-color: var(--wj-color); color: #ffffff; }

        .fx-card .btn { background-color: var(--fx-light); color: var(--fx-color); }
        .fx-card:hover .btn { background-color: var(--fx-color); color: #ffffff; }

        @media (max-width: 860px) {
            .portal-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>⚗️ 化学考研刷题系统</h1>
        <p>精准巩固考点 · 专项强化训练</p>
    </div>

    <div class="portal-grid">
        <!-- 物理化学入口 -->
        <a href="indexwh.html" class="portal-card wh-card">
            <div class="icon-box">⚛️</div>
            <h2>物理化学</h2>
            <p class="desc">热力学、动力学、电化学及胶体界面综合专练</p>
            <div class="btn">进入物化题库 →</div>
        </a>

        <!-- 无机化学入口 -->
        <a href="indexwj.html" class="portal-card wj-card">
            <div class="icon-box">🧪</div>
            <h2>无机化学</h2>
            <p class="desc">原子分子结构、配合物与元素性质系统刷题</p>
            <div class="btn">进入无机题库 →</div>
        </a>

        <!-- 分析化学入口 -->
        <a href="indexfx.html" class="portal-card fx-card">
            <div class="icon-box">📊</div>
            <h2>分析化学</h2>
            <p class="desc">四大滴定、误差分析及仪器分析考点演练</p>
            <div class="btn">进入分析题库 →</div>
        </a>
    </div>
</div>

</body>
</html>
