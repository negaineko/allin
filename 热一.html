1 2 分 (0001)
对于理想气体的内能有下述四种理解：
(1) 状态一定，内能也一定
(2) 对应于某一状态的内能是可以直接测定的
(3) 对应于某一状态，内能只有一个数值，不可能有两个或两个以上的数值
(4) 状态改变时，内能一定跟着改变
其中正确的是：
(A) (1),(2) (B) (3),(4)
(C) (2),(4) (D) (1),(3)
2 2 分 (0002)
下面陈述中，正确的是：
(A) 虽然Q 和W 是过程量，但由于 Q_v = \Delta U, Q_p = \Delta H，而U 和H 是状态函数，所以Q_v和Q_p是状态函数
(B) 热量是由温度差而传递的能量，它总是倾向于从含热量较多的高温物体流向含热量较少的低温物体
(C) 封闭体系与环境之间交换能量的形式非功即热
(D) 两物体之间只有存在温差，才可传递能量，反过来体系与环境间发生热量传递后，必然要引起体系温度变化

  // 改进版公式格式化：按 token 精确匹配，防止 $ 嵌套冲突
function formatMathFormula(text) {
  if (!text) return "";
  
  // 1. 如果原始文本本身就已经有成对的 $ 符号，说明已经是规范 LaTeX，直接返回
  if (text.includes('$')) return text;

  let t = text;

  // 2. 先保护/规范化最常见的标准态符号与带角标的物化物理量 (如 p^\theta, \Delta_r H_m^\theta, Q_p, W_1 等)
  t = t.replace(/(p\^\{\\theta\}|p\^\\theta|p\^\u03b8)/g, '$p^{\\theta}$');

  // 3. 将常见的带有反斜杠的物理化学表达式整体包裹 (如 \Delta U, \Delta_{vap}H, \partial U/\partial V 等)
  t = t.replace(/(\(?\\partial[^\s,，。)]+\)_[a-zA-Z0-9]+)/g, '$$$1$$');
  t = t.replace(/(\\Delta_?[a-zA-Z0-9{}]*\\?[a-zA-Z0-9{}^\\]*)/g, '$$$1$$');
  t = t.replace(/(\\Sigma\s+[^\s,，。]+)/g, '$$$1$$');
  t = t.replace(/(\\(?:alpha|gamma|xi|epsilon|nu|rightarrow))/g, '$$$1$$');

  // 4. 将类似 Q_v, Q_p, T_1, T_2, W_1, W_AB, C_p, C_v, C_{p,m}, p_1, V_1, dZ_1, dU, dT_p 等物理量变量包裹
  t = t.replace(/\b([QWTUCHSZVnp]|[d][TZV])_([a-zA-Z0-9\u4e00-\u9fa5]+)\b/g, '$$$1_{$2}$$');
  t = t.replace(/\bC_\{([a-zA-Z0-9,]+)\}/g, '$$C_{$1}$$');

  // 5. 将希腊字母符号（直接输入的 Unicode 符号，如 ΔU, ΔH）包裹
  t = t.replace(/(Δ[A-Za-z]+)/g, '$$$1$$');

  // 6. 清理可能不小心连在一起产生的重复 $$ 闭合标记 (例如 $$...$$$$...$$ 变成正常的)
  t = t.replace(/\$\$+/g, '$'); // 统一收拢
  // 把误合并成单 $ 的两端公式重新规范化（如果是成对的保持单个 $，避免语法错乱）
  
  return t;
}
