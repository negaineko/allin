  <style>
    :root {

      --primary-hover: #1d4ed8;

      --danger: #ef4444;

    .card {

    .star-btn {

    .q-content {

  <!-- 题库文本预留区（指导书第十章12题 + 例题与习题第十七章11题，共23题） -->
  <script type="text/plain" id="raw_q_text">
1. 卤素单质常温下的状态和颜色分别为：$\mathrm{I_2}$ 为______色______；$\mathrm{Br_2}$ 为______色______；$\mathrm{Cl_2}$ 为______色______；$\mathrm{F_2}$ 为______色______。
2. 少量碘溶解在 $\mathrm{CCl_4}$ 中为______色，少量溴溶解在 $\mathrm{CCl_4}$ 中为______色，少量碘溶解在 $\mathrm{KI}$ 溶液中为______色，碘溶解在乙醇中为______色。
3. $\mathrm{NF_3}$ 和 $\mathrm{NCl_3}$ 都是三角锥形分子，其中稳定性很差的是______；不易水解的是______。
4. 以 $\mathrm{X}$ 代表卤素，则室温时反应 $\mathrm{X_2 + 2OH^- = XO^- + X^- + H_2O}$，$\mathrm{X_2}$ 是指______；$\mathrm{NaX(s) + H_2SO_4(浓) = NaHSO_4 + HX\uparrow}$，$\mathrm{X}$ 是指______；难溶盐溶解反应 $\mathrm{AgX + 2S_2O_3^{2-} = [Ag(S_2O_3)_2]^{3-} + X^-}$，$\mathrm{X^-}$ 主要是指______。
5. 卤素氢化物中，能使 $[\mathrm{Fe(SCN)_6}]^{3-}$ 褪色的是______；不能使酸性 $\mathrm{KMnO_4}$ 溶液褪色的是______。
6. 用氰化物试剂做实验，废液应该用______等处理，如未经预处理便倒入废酸缸中，则会有剧毒的______产生。
7. 高溴酸和正高碘酸的化学式分别是______和______；其中酸性较强的是______，稳定性较高的是______。酸性最强的高卤酸是______。
8. $\mathrm{KClO_3}$ 是强______剂；$\mathrm{KClO_3}$ 溶液与过量 $\mathrm{KI}$ 溶液混合，溶液的颜色______，加稀硫酸后，反应的氧化产物主要是______；在酸性条件下，过量的 $\mathrm{KClO_3}$ 与 $\mathrm{KI}$ 溶液反应的氧化产物主要是______。
9. $\mathrm{BrO_3^-}$ 的空间构型为______，$\mathrm{Br}$ 采取______杂化方式；$\mathrm{ClF_3}$ 的空间构型为______，$\mathrm{Cl}$ 采取______杂化方式；$\mathrm{H_5IO_6}$ 的空间构型为______，$\mathrm{I}$ 采取______杂化方式。
10. 给出 5 种难溶于水的常见金属氯化物，分别是______。
11. 比较各对化合物的溶解度（用“<”或“>”填空）：(1) $\mathrm{NaF}$______$\mathrm{LiF}$；(2) $\mathrm{KClO_4}$______$\mathrm{NaClO_4}$；(3) $\mathrm{HgF_2}$______$\mathrm{HgCl_2}$；(4) $\mathrm{CuF_2}$______$\mathrm{CuCl_2}$。
12. 将 $\mathrm{HF}$、$\mathrm{HClO}$、$\mathrm{HBrO_3}$、$\mathrm{H_5IO_6}$ 按酸性由强至弱排列，顺序为______。
13. 给出下列物质的化学式：(1) 萤石______；(2) 冰晶石______；(3) 氟磷灰石______；(4) 光卤石______；(5) 光气______。
14. 下列物质或溶液的颜色为：$\mathrm{I_2}$______色，少量 $\mathrm{I_2}$ 溶于 $\mathrm{KI}$ 溶液中______色，$\mathrm{I_2}$ 溶于 $\mathrm{CCl_4}$ 中______色，$\mathrm{I_2}$ 溶于乙醇中______色。
15. 将 $\mathrm{Cl_2}$ 通入热的 $\mathrm{Ca(OH)_2}$ 溶液中，反应产物是______；低温下 $\mathrm{Br_2}$ 与 $\mathrm{Na_2CO_3}$ 溶液反应的产物是______；常温下 $\mathrm{I_2}$ 与 $\mathrm{NaOH}$ 溶液反应的产物是______。
16. $\mathrm{F}$、$\mathrm{Cl}$、$\mathrm{Br}$ 三元素中电子亲和能最大的是______，单质的解离能最小的是______。
17. 反应 $\mathrm{KX(s) + H_2SO_4(浓) = KHSO_4 + HX\uparrow}$ 中，卤化物 $\mathrm{KX}$ 是指______。
18. 导致氢氟酸的酸性与其他氢卤酸的酸性明显不同的因素主要是______和______小，而______特别大。
19. 比较下列各组物质的热稳定性：(1) $\mathrm{ClO_2}$______$\mathrm{I_2O_5}$；(2) $\mathrm{HClO_2}$______$\mathrm{HClO_4}$；(3) $\mathrm{IF_7}$______$\mathrm{BrF_7}$；(4) $\mathrm{NaICl_4}$______$\mathrm{CsICl_4}$。
20. 氢卤酸中，酸性最强的是______；能使 $[\mathrm{Fe(SCN)_6}]^{3-}$ 溶液褪色的是______；不能使酸性 $\mathrm{KMnO_4}$ 溶液褪色的是______。
21. 比较酸性与氧化性（用“>”或“<”填空）：氧化性：$\mathrm{HClO_3}$______$\mathrm{HClO}$；酸性：$\mathrm{HClO_3}$______$\mathrm{HClO}$。
22. 高碘酸是______元______酸，其酸根离子的空间构型为______形，其中碘原子的杂化方式为______，高碘酸具有强______性。
23. $\mathrm{Cl_2O}$ 和 $\mathrm{ClO_2}$ 分子结构均为______形，但 $\mathrm{ClO_2}$ 分子中的 $\mathrm{Cl-O}$ 键长比 $\mathrm{Cl_2O}$ 分子中的 $\mathrm{Cl-O}$ 键长______，原因是______。
  </script>

  <script>
    /* 答案标准库与同义词配置 */
    const ansMap = {
      1: [["紫黑色", "暗紫", "黑紫"], ["固体", "固态"], ["深红棕", "红棕", "暗红"], ["液体", "液态"], ["黄绿", "黄绿色"], ["气体", "气态"], ["浅黄绿", "淡黄绿", "淡黄"], ["气体", "气态"]],
      2: [["紫", "紫色", "紫红色"], ["红棕", "橙红", "橙色"], ["棕", "棕黄", "深棕色"], ["棕", "棕褐", "黄色"]],
      3: [["NCl3", "三氯化氮"], ["NF3", "三氟化氮"]],
      4: [["Cl2、Br2", "Cl2, Br2", "Cl2和Br2"], ["F-、Cl-", "F-, Cl-", "F-和Cl-", "F、Cl"], ["Cl-、Br-", "Cl-, Br-", "Cl-和Br-", "Cl、Br"]],
      5: [["HI", "I-", "氢碘酸"], ["HF", "F-", "氢氟酸"]],
      6: [["次氯酸钠(NaClO)或碱性高锰酸钾", "NaClO", "次氯酸盐", "碱性KMnO4"], ["HCN", "氰化氢"]],
      7: [["HBrO4"], ["H5IO6", "HIO4·2H2O"], ["HBrO4"], ["H5IO6"], ["HClO4"]],
      8: [["氧化"], ["无明显变化", "不变色", "无色"], ["I2", "单质碘"], ["KIO3", "IO3-", "碘酸钾"]],
      9: [["三角锥形", "三角锥"], ["不等性sp3", "sp3"], ["T形", "T字形"], ["不等性sp3d", "sp3d"], ["正八面体", "正八面体形", "八面体"], ["sp3d2", "sp^3d^2"]],
      10: [["AgCl、PbCl2、Hg2Cl2、CuCl、TlCl", "AgCl, PbCl2, Hg2Cl2, CuCl, TlCl", "AgCl、PbCl2、CuCl、Hg2Cl2、BiOCl"]],
      11: [[">"], ["<"], [">"], ["<"]],
      12: [["HBrO3 > H5IO6 > HF > HClO", "HBrO3 > HF > HClO > H5IO6", "HBrO3>HF>H5IO6>HClO", "HBrO3>HF>HClO"]],
      13: [["CaF2"], ["Na3[AlF6]", "Na3AlF6"], ["Ca5(PO4)3F", "CaFCa4(PO4)3"], ["KCl·MgCl2·6H2O", "KCl.MgCl2.6H2O"], ["COCl2"]],
      14: [["紫黑色", "暗紫", "黑紫"], ["棕", "棕黄色"], ["紫", "紫红"], ["棕", "棕褐色"]],
      15: [["Ca(ClO3)2 + CaCl2 + H2O", "Ca(ClO3)2和CaCl2"], ["NaBrO + NaBr + NaHCO3", "NaBrO, NaBr, CO2"], ["NaIO3 + NaI + H2O", "NaIO3和NaI"]],
      16: [["Cl", "氯"], ["F2", "F", "氟"]],
      17: [["KF、KCl", "KF, KCl", "KF和KCl", "F-与Cl-盐"]],
      18: [["F-的极化率", "半径", "水合热"], ["H-F键能", "键能", "电离常数"], ["H-F键能", "H-F键解离能", "键能"]],
      19: [["<"], ["<"], [">"], ["<"]],
      20: [["HI", "氢碘酸"], ["HI", "氢碘酸"], ["HF", "氢氟酸"]],
      21: [["<"], [">"]],
      22: [["五", "5", "多元"], ["弱", "中强"], ["正八面体", "八面体"], ["sp3d2", "sp^3d^2"], ["氧化"]],
      23: [["V", "角", "V形", "折线"], ["短", "更短", "小"], ["ClO2中存在离域的三中心五电子大π键(或具有一定双键特征)", "存在三中心五电子三键", "离域π键大π(3,5)"]]
    };

    let questions = [];
    let currentIndex = 0;
    let examMode = 'realtime';
    let currentFilter = 'all';
    
    let userData = {
      answers: {},
      submitted: {},
      starred: {},
      evalResults: {}
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      parseRawQuestions();
      renderSidebar();
      renderCard(currentIndex);
      updateStats();

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') prevQuestion();
        if (e.key === 'ArrowRight') nextQuestion();
      });
    });

    function parseRawQuestions() {
      const raw = document.getElementById('raw_q_text').innerText.trim();
      const lines = raw.split('\n').filter(l => l.trim().length > 0);
      
      questions = lines.map((line, idx) => {
        const id = idx + 1;
        let text = line.replace(/^\d+[\.、\s]+/, '').trim();
        let source = id <= 12 ? "考研指导 第十章 (卤素)" : "例题与习题 第十七章 (卤素)";

        return {
          id: id,
          title: `第 ${id} 题`,
          source: source,
          rawText: text,
          ansList: ansMap[id] || []
        };
      });
    }

    function renderCard(index) {
      if (index < 0 || index >= questions.length) return;
      currentIndex = index;
      const q = questions[currentIndex];
      
      document.getElementById('q-source-badge').innerText = `[${q.source}] 题号 ${q.id}`;
      document.getElementById('q-index-badge').innerText = `${currentIndex + 1} / ${questions.length}`;
      
      const starBtn = document.getElementById('star-btn');
      starBtn.className = 'star-btn' + (userData.starred[q.id] ? ' active' : '');

      const contentBox = document.getElementById('q-content-box');
      const savedAns = userData.answers[q.id] || [];
      
      let blankIdx = 0;
      let html = q.rawText.replace(/_{2,}/g, () => {
        const val = savedAns[blankIdx] || '';
        const bId = `blank-${q.id}-${blankIdx}`;
        const inputHtml = `<input type="text" id="${bId}" class="fill-blank" value="${escapeHtml(val)}" 
          data-blank-idx="${blankIdx}" onblur="onInputBlur(${q.id}, ${blankIdx})" onkeydown="handleInputKey(event, ${q.id}, ${blankIdx})" autocomplete="off" />`;
        blankIdx++;
        return inputHtml;
      });

      contentBox.innerHTML = html;

      const ansBox = document.getElementById('ans-box');
      const ansContent = document.getElementById('ans-content');
      
      if (examMode === 'realtime' && userData.submitted[q.id]) {
        renderAnswerBox(q, ansBox, ansContent);
        applyBlankStyles(q);
      } else {
        ansBox.className = 'ans-box';
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([contentBox, ansBox]);
      }

      updateSidebarHighlight();
    }

    function normalizeStr(str) {
      if (!str) return '';
      return str
        .trim()
        .toLowerCase()
        .replace(/[\uff01-\uff5e]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
        .replace(/\s+/g, '')
        .replace(/[，、]/g, ',');
    }

    function checkAnswerCorrect(userVal, acceptedList) {
      if (!acceptedList || acceptedList.length === 0) return true;
      const normUser = normalizeStr(userVal);
      if (!normUser) return false;
      return acceptedList.some(item => normalizeStr(item) === normUser);
    }

    function onInputBlur(qId, bIdx) {
      const input = document.getElementById(`blank-${qId}-${bIdx}`);
      if (!input) return;
      if (!userData.answers[qId]) userData.answers[qId] = [];
      userData.answers[qId][bIdx] = input.value;
      saveStorage();
      updateStats();

      if (examMode === 'realtime' && userData.submitted[qId]) {
        applyBlankStyles(questions.find(q => q.id === qId));
      }
    }

    function handleInputKey(e, qId, bIdx) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const nextInput = document.getElementById(`blank-${qId}-${bIdx + 1}`);
        if (nextInput) {
          nextInput.focus();
        } else {
          checkCurrentAnswer();
        }
      }
    }

    function checkCurrentAnswer() {
      const q = questions[currentIndex];
      const inputs = document.querySelectorAll('#q-content-box .fill-blank');
      
      if (!userData.answers[q.id]) userData.answers[q.id] = [];
      inputs.forEach((input, i) => {
        userData.answers[q.id][i] = input.value;
      });

      userData.submitted[q.id] = true;

      let allCorrect = true;
      q.ansList.forEach((accepted, idx) => {
        const uVal = userData.answers[q.id][idx] || '';
        if (!checkAnswerCorrect(uVal, accepted)) {
          allCorrect = false;
        }
      });
      userData.evalResults[q.id] = allCorrect;

      saveStorage();
      updateStats();
      renderSidebar();

      if (examMode === 'realtime') {
        const ansBox = document.getElementById('ans-box');
        const ansContent = document.getElementById('ans-content');
        renderAnswerBox(q, ansBox, ansContent);
        applyBlankStyles(q);
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([ansBox]);
        }
      } else {
        alert('作答已记录！在模拟考试模式下交卷后统一核对结果。');
      }
    }

    function applyBlankStyles(q) {
      const inputs = document.querySelectorAll('#q-content-box .fill-blank');
      inputs.forEach((input, idx) => {
        const accepted = q.ansList[idx] || [];
        const isOk = checkAnswerCorrect(input.value, accepted);
        input.className = 'fill-blank ' + (isOk ? 'correct' : 'wrong');
      });
    }

    function renderAnswerBox(q, box, contentEl) {
      box.className = 'ans-box show';
      let html = '<ol style="padding-left: 20px; margin-top: 4px;">';
      q.ansList.forEach((ansGroup, i) => {
        html += `<li>空 ${i + 1}：<b>${escapeHtml(ansGroup[0])}</b> ${ansGroup.length > 1 ? `<span style="color:#64748b;font-size:0.85rem;">(等价表达: ${ansGroup.slice(1).join(' / ')})</span>` : ''}</li>`;
      });
      html += '</ol>';
      contentEl.innerHTML = html;
    }

    function toggleMode() {
      examMode = examMode === 'realtime' ? 'mock' : 'realtime';
      document.getElementById('mode-toggle-btn').innerText = examMode === 'realtime' ? '模式：实时练习' : '模式：模拟考试';
      renderCard(currentIndex);
      renderSidebar();
    }

    function toggleCurrentStar() {
      const q = questions[currentIndex];
      userData.starred[q.id] = !userData.starred[q.id];
      saveStorage();
      updateStats();
      renderCard(currentIndex);
      renderSidebar();
    }

    function prevQuestion() {
      if (currentIndex > 0) renderCard(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) renderCard(currentIndex + 1);
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderSidebar();
    }

    function renderSidebar() {
      const grid = document.getElementById('sheet-grid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const isSubmitted = userData.submitted[q.id];
        const isCorrect = userData.evalResults[q.id];
        const isStarred = userData.starred[q.id];

        if (currentFilter === 'wrong' && (!isSubmitted || isCorrect)) return;
        if (currentFilter === 'starred' && !isStarred) return;

        const item = document.createElement('div');
        item.className = 'sheet-item';
        item.innerText = q.id;

        if (examMode === 'realtime') {
          if (isSubmitted) {
            item.classList.add(isCorrect ? 'correct' : 'wrong');
          }
        } else {
          if (isSubmitted) item.classList.add('done-mock');
        }

        if (idx === currentIndex) item.classList.add('current');

        item.onclick = () => renderCard(idx);
        grid.appendChild(item);
      });
    }

    function updateSidebarHighlight() {
      const items = document.querySelectorAll('.sheet-item');
      items.forEach(it => {
        if (parseInt(it.innerText) === questions[currentIndex].id) {
          it.classList.add('current');
        } else {
          it.classList.remove('current');
        }
      });
    }

    function updateStats() {
      const total = questions.length;
      let doneCount = 0;
      let correctCount = 0;
      let starCount = 0;

      questions.forEach(q => {
        if (userData.submitted[q.id]) {
          doneCount++;
          if (userData.evalResults[q.id]) correctCount++;
        }
        if (userData.starred[q.id]) starCount++;
      });

      document.getElementById('stat-done').innerText = `${doneCount}/${total}`;
      document.getElementById('stat-rate').innerText = doneCount === 0 ? '0%' : `${Math.round((correctCount / doneCount) * 100)}%`;
      document.getElementById('stat-starred').innerText = starCount;
    }

    function saveStorage() {
      localStorage.setItem('inorganic_chem_unit7_progress', JSON.stringify(userData));
    }

    function loadStorage() {
      const data = localStorage.getItem('inorganic_chem_unit7_progress');
      if (data) {
        try {
          userData = JSON.parse(data);
        } catch (e) {
          console.error("加载存档失败:", e);
        }
      }
    }

    function resetAllProgress() {
      if (confirm("确定要清空第七单元的所有做题记录和收藏状态吗？")) {
        localStorage.removeItem('inorganic_chem_unit7_progress');
        userData = { answers: {}, submitted: {}, starred: {}, evalResults: {} };
        renderCard(0);
        renderSidebar();
        updateStats();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
