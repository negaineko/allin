1. 若成键原子沿 z 轴方向接近，下列双原子分子成键时重叠的轨道是：$\mathrm{H_2}$______，$\mathrm{Cl_2}$______，$\mathrm{N_2}$______，$\mathrm{Na_2}$______，$\mathrm{HCl}$______。

5. 在 $\mathrm{H_3C-SF_5}$ 分子中，$\mathrm{C}$ 原子采取______杂化，$\mathrm{S}$ 原子采取______杂化，$\mathrm{C}$ 与 $\mathrm{S}$ 形成键的轨道是______。
6. 原子轨道线性组合成分子轨道的三原则分别是______、______和______。

9. 在 $\mathrm{NO_2^+}$、$\mathrm{NO_2}$、$\mathrm{NO_2^-}$、$\mathrm{NO_3^-}$ 分子或离子中，键角最大的是______，键角最小的是______。
10. 给出 $\mathrm{CO_2}$ 四个等电子体的分子或离子，分别为______；给出 $\mathrm{CO}$ 四个等电子体的分子或离子，分别为______。
11. 水分子间作用力有______；甲烷分子间作用力有______；水分子与甲烷分子间作用力有______。

20. 给出晶体中离子的配位数比：$\mathrm{NaCl}$______，$\mathrm{ZnS}$（立方）______，$\mathrm{CsCl}$______。
21. $\mathrm{Ag}^+$ 半径为 $128\ \mathrm{pm}$，$\mathrm{I}^-$ 半径为 $220\ \mathrm{pm}$，按半径比规则，$\mathrm{AgI}$ 具有______型结构，离子的配位数应为______，实际上 $\mathrm{AgI}$ 晶体中配位数为______，这是由于______造成的。
22. 给出金属晶体的晶胞中原子数：六方密堆积______，立方面心密堆积______，立方体心密堆积______，金刚石型堆积______。
23. 下列各物质中，是 $\mathrm{CO}$ 的等电子体的有______。（从 $\mathrm{NO}^+$、$\mathrm{O_2}$、$\mathrm{N_2}$、$\mathrm{HF}$、$\mathrm{CN}^-$ 中选取）
24. 下列分子或离子中键角由大到小排列的顺序是______。（$\mathrm{BCl_3}$、$\mathrm{NH_3}$、$\mathrm{H_2O}$、$\mathrm{PCl_3}$、$\mathrm{HgCl_2}$）
25. 给出各分子或离子的空间构型和中心原子的杂化方式：$\mathrm{ICl_2^-}$______；$\mathrm{ICl_4^-}$______；$\mathrm{BrF_3}$______；$\mathrm{NO_2^+}$______。
26. 给出下列分子或离子的中心原子的杂化方式：$\mathrm{NCl_3}$______，$\mathrm{IF_5}$______，$\mathrm{TeCl_4}$______。
27. 下列分子或离子中，键角最大的是______，键角最小的是______。（$\mathrm{H_2O}$、$\mathrm{NH_3}$、$\mathrm{BF_3}$、$\mathrm{CH_4}$）

      25: [["直线形，sp3d", "直线形, sp3d", "直线, sp3d"], ["平面正方形，sp3d2", "平面正方形, sp3d2", "正方形, sp3d2"], ["T形，sp3d", "T形, sp3d", "T字形, sp3d"], ["直线形，sp", "直线形, sp", "直线, sp"]],
      26: [["不等性sp3", "sp3", "不等性sp^3"], ["sp3d2", "不等性sp3d2", "sp^3d^2"], ["不等性sp3d", "sp3d", "不等性sp^3d"]],
      27: [["BF3", "BF_3"], ["H2O", "H_2O"]],
      28: [["O2+", "O2^+"], ["O22-", "O2^2-"]],
      29: [["1206", "1206.0"], ["691.2", "691"], ["37.6", "37.60"]],
      30: [["不等性sp3", "sp3", "不等性sp^3"], ["sp3d", "sp^3d"], ["不等性sp3", "sp3", "不等性sp^3"], ["不等性sp3", "sp3", "不等性sp^3"], ["sp"], ["sp2", "sp^2"]]
    };

    /* 状态与控制逻辑 */
    let questions = [];
    let currentIndex = 0;
    let examMode = 'realtime'; // 'realtime' | 'mock'
    let currentFilter = 'all'; // 'all' | 'wrong' | 'starred'
    
    let userData = {
      answers: {},
      submitted: {},
      starred: {},
      evalResults: {}
    };

    window.addEventListener('DOMContentLoaded', () => {
      loadStorage();
      parseRawQuestions();
      renderSidebar();
      renderCard(currentIndex);
      updateStats();

      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.key === 'ArrowLeft') prevQuestion();
        if (e.key === 'ArrowRight') nextQuestion();
      });
    });

    function parseRawQuestions() {
      const raw = document.getElementById('raw_q_text').innerText.trim();
      const lines = raw.split('\n').filter(l => l.trim().length > 0);
      
      questions = lines.map((line, idx) => {
        const id = idx + 1;
        let text = line.replace(/^\d+[\.、\s]+/, '').trim();
        return {
          id: id,
          title: `第 ${id} 题`,
          source: id <= 22 ? "考研指导 第六章" : "例题与习题 第六章",
          rawText: text,
          ansList: ansMap[id] || []
        };
      });
    }

    function renderCard(index) {
      if (index < 0 || index >= questions.length) return;
      currentIndex = index;
      const q = questions[currentIndex];
      
      document.getElementById('q-source-badge').innerText = `[${q.source}] 题号 ${q.id}`;
      document.getElementById('q-index-badge').innerText = `${currentIndex + 1} / ${questions.length}`;
      
      const starBtn = document.getElementById('star-btn');
      starBtn.className = 'star-btn' + (userData.starred[q.id] ? ' active' : '');

      const contentBox = document.getElementById('q-content-box');
      const savedAns = userData.answers[q.id] || [];
      
      let blankIdx = 0;
      let html = q.rawText.replace(/_{2,}/g, () => {
        const val = savedAns[blankIdx] || '';
        const bId = `blank-${q.id}-${blankIdx}`;
        const inputHtml = `<input type="text" id="${bId}" class="fill-blank" value="${escapeHtml(val)}" 
          data-blank-idx="${blankIdx}" onblur="onInputBlur(${q.id}, ${blankIdx})" onkeydown="handleInputKey(event, ${q.id}, ${blankIdx})" autocomplete="off" />`;
        blankIdx++;
        return inputHtml;
      });

      contentBox.innerHTML = html;

      const ansBox = document.getElementById('ans-box');
      const ansContent = document.getElementById('ans-content');
      
      if (examMode === 'realtime' && userData.submitted[q.id]) {
        renderAnswerBox(q, ansBox, ansContent);
        applyBlankStyles(q);
      } else {
        ansBox.className = 'ans-box';
      }

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([contentBox, ansBox]);
      }

      updateSidebarHighlight();
    }

    function normalizeStr(str) {
      if (!str) return '';
      return str
        .trim()
        .toLowerCase()
        .replace(/[\uff01-\uff5e]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0))
        .replace(/\s+/g, '')
        .replace(/[，、]/g, ',');
    }

    function checkAnswerCorrect(userVal, acceptedList) {
      if (!acceptedList || acceptedList.length === 0) return true;
      const normUser = normalizeStr(userVal);
      if (!normUser) return false;
      return acceptedList.some(item => normalizeStr(item) === normUser);
    }

    function onInputBlur(qId, bIdx) {
      const input = document.getElementById(`blank-${qId}-${bIdx}`);
      if (!input) return;
      if (!userData.answers[qId]) userData.answers[qId] = [];
      userData.answers[qId][bIdx] = input.value;
      saveStorage();
      updateStats();

      if (examMode === 'realtime' && userData.submitted[qId]) {
        applyBlankStyles(questions.find(q => q.id === qId));
      }
    }

    function handleInputKey(e, qId, bIdx) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const nextInput = document.getElementById(`blank-${qId}-${bIdx + 1}`);
        if (nextInput) {
          nextInput.focus();
        } else {
          checkCurrentAnswer();
        }
      }
    }

    function checkCurrentAnswer() {
      const q = questions[currentIndex];
      const inputs = document.querySelectorAll('#q-content-box .fill-blank');
      
      if (!userData.answers[q.id]) userData.answers[q.id] = [];
      inputs.forEach((input, i) => {
        userData.answers[q.id][i] = input.value;
      });

      userData.submitted[q.id] = true;

      let allCorrect = true;
      q.ansList.forEach((accepted, idx) => {
        const uVal = userData.answers[q.id][idx] || '';
        if (!checkAnswerCorrect(uVal, accepted)) {
          allCorrect = false;
        }
      });
      userData.evalResults[q.id] = allCorrect;

      saveStorage();
      updateStats();
      renderSidebar();

      if (examMode === 'realtime') {
        const ansBox = document.getElementById('ans-box');
        const ansContent = document.getElementById('ans-content');
        renderAnswerBox(q, ansBox, ansContent);
        applyBlankStyles(q);
        if (window.MathJax && window.MathJax.typesetPromise) {
          MathJax.typesetPromise([ansBox]);
        }
      } else {
        alert('作答已记录！在模拟考试模式下交卷后统一核对结果。');
      }
    }

    function applyBlankStyles(q) {
      const inputs = document.querySelectorAll('#q-content-box .fill-blank');
      inputs.forEach((input, idx) => {
        const accepted = q.ansList[idx] || [];
        const isOk = checkAnswerCorrect(input.value, accepted);
        input.className = 'fill-blank ' + (isOk ? 'correct' : 'wrong');
      });
    }

    function renderAnswerBox(q, box, contentEl) {
      box.className = 'ans-box show';
      let html = '<ol style="padding-left: 20px; margin-top: 4px;">';
      q.ansList.forEach((ansGroup, i) => {
        html += `<li>空 ${i + 1}：<b>${escapeHtml(ansGroup[0])}</b> ${ansGroup.length > 1 ? `<span style="color:#64748b;font-size:0.85rem;">(等价表达: ${ansGroup.slice(1).join(' / ')})</span>` : ''}</li>`;
      });
      html += '</ol>';
      contentEl.innerHTML = html;
    }

    function toggleMode() {
      examMode = examMode === 'realtime' ? 'mock' : 'realtime';
      document.getElementById('mode-toggle-btn').innerText = examMode === 'realtime' ? '模式：实时练习' : '模式：模拟考试';
      renderCard(currentIndex);
      renderSidebar();
    }

    function toggleCurrentStar() {
      const q = questions[currentIndex];
      userData.starred[q.id] = !userData.starred[q.id];
      saveStorage();
      updateStats();
      renderCard(currentIndex);
      renderSidebar();
    }

    function prevQuestion() {
      if (currentIndex > 0) renderCard(currentIndex - 1);
    }

    function nextQuestion() {
      if (currentIndex < questions.length - 1) renderCard(currentIndex + 1);
    }

    function setFilter(filter, btn) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderSidebar();
    }

    function renderSidebar() {
      const grid = document.getElementById('sheet-grid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const isSubmitted = userData.submitted[q.id];
        const isCorrect = userData.evalResults[q.id];
        const isStarred = userData.starred[q.id];

        if (currentFilter === 'wrong' && (!isSubmitted || isCorrect)) return;
        if (currentFilter === 'starred' && !isStarred) return;

        const item = document.createElement('div');
        item.className = 'sheet-item';
        item.innerText = q.id;

        if (examMode === 'realtime') {
          if (isSubmitted) {
            item.classList.add(isCorrect ? 'correct' : 'wrong');
          }
        } else {
          if (isSubmitted) item.classList.add('done-mock');
        }

        if (idx === currentIndex) item.classList.add('current');

        item.onclick = () => renderCard(idx);
        grid.appendChild(item);
      });
    }

    function updateSidebarHighlight() {
      const items = document.querySelectorAll('.sheet-item');
      items.forEach(it => {
        if (parseInt(it.innerText) === questions[currentIndex].id) {
          it.classList.add('current');
        } else {
          it.classList.remove('current');
        }
      });
    }

    function updateStats() {
      const total = questions.length;
      let doneCount = 0;
      let correctCount = 0;
      let starCount = 0;

      questions.forEach(q => {
        if (userData.submitted[q.id]) {
          doneCount++;
          if (userData.evalResults[q.id]) correctCount++;
        }
        if (userData.starred[q.id]) starCount++;
      });

      document.getElementById('stat-done').innerText = `${doneCount}/${total}`;
      document.getElementById('stat-rate').innerText = doneCount === 0 ? '0%' : `${Math.round((correctCount / doneCount) * 100)}%`;
      document.getElementById('stat-starred').innerText = starCount;
    }

    function saveStorage() {
      localStorage.setItem('inorganic_chem_unit2_progress', JSON.stringify(userData));
    }

    function loadStorage() {
      const data = localStorage.getItem('inorganic_chem_unit2_progress');
      if (data) {
        try {
          userData = JSON.parse(data);
        } catch (e) {
          console.error("加载存档失败:", e);
        }
      }
    }

    function resetAllProgress() {
      if (confirm("确定要清空第二单元的所有做题记录和收藏状态吗？")) {
        localStorage.removeItem('inorganic_chem_unit2_progress');
        userData = { answers: {}, submitted: {}, starred: {}, evalResults: {} };
        renderCard(0);
        renderSidebar();
        updateStats();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
