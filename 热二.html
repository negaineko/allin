    header {

      border-bottom: 1px solid var(--border-color);
      padding: 14px 20px;
      display: flex;

    .action-btn {
      background: #f1f5f9;
      border: 1px solid var(--border-color);

      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .action-btn:hover {
      background: #e2e8f0;
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      margin: 20px auto;
      padding: 0 16px;
      flex: 1;

    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

      background: var(--card-bg);
      border-radius: 16px;
      padding: 24px;

      flex-direction: column;

      justify-content: space-between;
      align-items: center;
      gap: 12px;

      color: var(--primary);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;

      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #94a3b8;
      transition: color 0.2s;

    .star-btn.starred {
      color: #f59e0b;
    }

    .question-text {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-main);

      font-size: 14px;

    .option-btn:hover {

      background: #f8fafc;

    .option-btn.selected {

    .option-btn.correct {

      background: var(--success-bg);
      color: #15803d;

    .option-btn.wrong {

  <script>
    // 完整的 152 题答案映射 (A=0, B=1, C=2, D=3)
    // 包含珀莱专属修正：4题改D(3)，39题改C(2)
    const ansMap = {
      1:1, 2:2, 3:2, 4:3, 5:0, 6:2, 7:1, 8:3, 9:2, 10:0,
      11:0, 12:1, 13:1, 14:2, 15:3, 16:1, 17:3, 18:2, 19:0, 20:0,
      21:3, 22:2, 23:1, 24:3, 25:1, 26:1, 27:2, 28:2, 29:3, 30:0,
      31:1, 32:0, 33:1, 34:0, 35:1, 36:3, 37:0, 38:0, 39:2, 40:0,
      41:2, 42:1, 43:2, 44:1, 45:2, 46:2, 47:0, 48:2, 49:3, 50:1,
      51:1, 52:1, 53:0, 54:0, 55:2, 56:0, 57:0, 58:2, 59:3, 60:2,
      61:3, 62:2, 63:2, 64:2, 65:2, 66:0, 67:3, 68:0, 69:1, 70:2,
      71:0, 72:1, 73:3, 74:2, 75:0, 76:0, 77:0, 78:0, 79:0, 80:3,
      81:1, 82:3, 83:1, 84:0, 85:1, 86:2, 87:0, 88:1, 89:1, 90:3,
      91:0, 92:0, 93:0, 94:2, 95:1, 96:3, 97:2, 98:2, 99:0, 100:2,
      101:1, 102:3, 103:2, 104:1, 105:1, 106:3, 107:2, 108:2, 109:0, 110:2,
      111:1, 112:0, 113:2, 114:1, 115:3, 116:3, 117:1, 118:0, 119:1, 120:0,
      121:3, 122:3, 123:2, 124:0, 125:1, 126:1, 127:3, 128:1, 129:2, 130:1,
      131:2, 132:0, 133:2, 134:0, 135:1, 136:2, 137:0, 138:1, 139:0, 140:0,
      141:0, 142:3, 143:2, 144:1, 145:1, 146:1, 147:2, 148:0, 149:1, 150:0,
      151:0, 152:3
    };

    const rawQText = document.getElementById('raw_q_text').innerText;
    // 匹配如 "1 1 分 (0624)" 这样的题号头
    const regex = /\n(\d+)\s+\d+\s*分\s*\(\d+\)/g;
    
    const textToParse = "\n" + rawQText.trim();
    let parts = textToParse.split(regex);
    let parsedData = [];
    
    for(let i=1; i<parts.length; i+=2) {
      let qNum = parseInt(parts[i]);
      let text = parts[i+1].trim();
      
      let optA = text.indexOf('(A)');
      let optB = text.indexOf('(B)');
      let optC = text.indexOf('(C)');
      let optD = text.indexOf('(D)');
      
      let qStr = text;
      let opts = ["选项 A", "选项 B", "选项 C", "选项 D"];
      
      if(optA !== -1 && optB !== -1) {
        qStr = text.substring(0, optA).trim();
        let endA = optB;
        let endB = optC !== -1 ? optC : text.length;
        let endC = optD !== -1 ? optD : text.length;
        let endD = text.length;
        
        opts[0] = text.substring(optA+3, endA).trim();
        opts[1] = text.substring(optB+3, endB).trim();
        if(optC !== -1) opts[2] = text.substring(optC+3, endC).trim();
        if(optD !== -1) opts[3] = text.substring(optD+3, endD).trim();
      }
      
      parsedData.push({
        id: qNum,
        q: qNum + ". " + qStr,
        opts: opts,
        ans: ansMap[qNum] !== undefined ? ansMap[qNum] : 0,
        exp: "解析：本题标准答案选 " + String.fromCharCode(65 + (ansMap[qNum]||0)) + "。（详细解析请参考第二单元纸质版哦～）"
      });
    }

    let quizData = [];
    for(let i=1; i<=152; i++) {
        let found = parsedData.find(item => item.id === i);
        if(found) {
            quizData.push(found);
        } else {
            quizData.push({
                q: i + ". (由于内容较多，本题暂未提取文本，请参考纸质版原题哦~ 但正确答案已收录⬇️)",
                opts: ["选项 A", "选项 B", "选项 C", "选项 D"],
                ans: ansMap[i] || 0,
                exp: "解析：本题标准答案选 " + String.fromCharCode(65 + (ansMap[i]||0)) + "。"
            });
        }
    }

    let curIdx = 0;
    // 使用 u2 专属的本地存储 Key，避免跟第一单元打架
    let userAnswers = JSON.parse(localStorage.getItem('jlu_phychem_u2_ans_v4')) || {};
    let userStars = JSON.parse(localStorage.getItem('jlu_phychem_u2_stars_v4')) || {};
    let currentFilter = 'all';
    let isExamMode = false;

    const qIdxTag = document.getElementById('qIdxTag');
    const qText = document.getElementById('qText');
    const optList = document.getElementById('optList');
    const expBox = document.getElementById('expBox');
    const expContent = document.getElementById('expContent');
    const starBtn = document.getElementById('starBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const submitBtn = document.getElementById('submitBtn');
    const gridMatrix = document.getElementById('gridMatrix');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const resetAllBtn = document.getElementById('resetAllBtn');
    const jumpInput = document.getElementById('jumpInput');

    function renderQuestion() {
      const item = quizData[curIdx];
      qIdxTag.innerText = `第 ${curIdx + 1} / 152 题`;
      qText.innerText = item.q;
      optList.innerHTML = '';
      expBox.style.display = 'none';

      starBtn.classList.toggle('starred', !!userStars[curIdx]);

      const answered = userAnswers[curIdx] !== undefined;
      const selectedOpt = userAnswers[curIdx];

      item.opts.forEach((opt, idx) => {
        const optBtn = document.createElement('div');
        optBtn.className = 'option-btn';
        const optCode = String.fromCharCode(65 + idx);
        
        optBtn.innerHTML = `<span class="opt-code">${optCode}</span><span>${opt}</span>`;

        if (answered) {
          if (!isExamMode) {
            if (idx === item.ans) optBtn.classList.add('correct');
            if (selectedOpt === idx && idx !== item.ans) optBtn.classList.add('wrong');
          } else {
            if (selectedOpt === idx) optBtn.classList.add('selected');
          }
        } else {
          optBtn.onclick = () => selectOption(idx);
        }

        optList.appendChild(optBtn);
      });

      if (answered && !isExamMode) {
        expContent.innerText = item.exp;
        expBox.style.display = 'block';
        submitBtn.style.display = 'none';
      } else {
        submitBtn.style.display = 'block';
      }

      renderGrid();
      updateStats();
      if (window.MathJax) MathJax.typesetPromise();
    }

    function selectOption(optIdx) {
      userAnswers[curIdx] = optIdx;
      localStorage.setItem('jlu_phychem_u2_ans_v4', JSON.stringify(userAnswers));
      renderQuestion();
    }

    function renderGrid() {
      gridMatrix.innerHTML = '';
      quizData.forEach((item, idx) => {
        if (currentFilter === 'wrong' && !(userAnswers[idx] !== undefined && userAnswers[idx] !== item.ans)) return;
        if (currentFilter === 'starred' && !userStars[idx]) return;

        const gridItem = document.createElement('div');
        gridItem.className = 'grid-item';
        gridItem.innerText = idx + 1;

        if (idx === curIdx) gridItem.classList.add('current');
        if (userStars[idx]) gridItem.classList.add('starred');

        if (userAnswers[idx] !== undefined) {
          if(!isExamMode) {
            if (userAnswers[idx] === item.ans) {
              gridItem.classList.add('correct');
            } else {
              gridItem.classList.add('wrong');
            }
          } else {
            gridItem.style.background = '#eff6ff';
            gridItem.style.borderColor = '#2563eb';
          }
        }

        gridItem.onclick = () => {
          curIdx = idx;
          renderQuestion();
        };

        gridMatrix.appendChild(gridItem);
      });
    }

    function updateStats() {
      const answeredKeys = Object.keys(userAnswers);
      const completedCount = answeredKeys.length;
      let correctCount = 0;

      answeredKeys.forEach(k => {
        if (userAnswers[k] === quizData[k].ans) correctCount++;
      });

      const acc = completedCount > 0 ? Math.round((correctCount / completedCount) * 100) : 0;
      const starredCount = Object.keys(userStars).filter(k => userStars[k]).length;

      document.getElementById('statCompleted').innerText = completedCount;
      document.getElementById('statAccuracy').innerText = acc + '%';
      document.getElementById('statStarred').innerText = starredCount;
    }

    starBtn.onclick = () => {
      userStars[curIdx] = !userStars[curIdx];
      localStorage.setItem('jlu_phychem_u2_stars_v4', JSON.stringify(userStars));
      renderQuestion();
    };

    prevBtn.onclick = () => {
      if (curIdx > 0) { curIdx--; renderQuestion(); }
    };

    nextBtn.onclick = () => {
      if (curIdx < quizData.length - 1) { curIdx++; renderQuestion(); }
    };

    submitBtn.onclick = () => {
      if (userAnswers[curIdx] === undefined) {
        alert("先选个答案再提交啦！");
        return;
      }
      renderQuestion();
    };

    modeToggleBtn.onclick = () => {
      isExamMode = !isExamMode;
      modeToggleBtn.innerText = isExamMode ? "模式: 模拟考试" : "模式: 实时练习";
      renderQuestion();
    };

    resetAllBtn.onclick = () => {
      if (confirm("确定要清空第二单元的所有刷题记录和收藏状态吗？")) {
        userAnswers = {};
        userStars = {};
        localStorage.removeItem('jlu_phychem_u2_ans_v4');
        localStorage.removeItem('jlu_phychem_u2_stars_v4');
        curIdx = 0;
        renderQuestion();
      }
    };

    jumpInput.onchange = (e) => {
      const val = parseInt(e.target.value, 10);
      if (val >= 1 && val <= 152) {
        curIdx = val - 1;
        renderQuestion();
      }
    };

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.onclick = (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentFilter = e.target.dataset.filter;
        renderGrid();
      };
    });

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === jumpInput) return;
      if (e.key === 'ArrowLeft') {
        if (curIdx > 0) { curIdx--; renderQuestion(); }
      } else if (e.key === 'ArrowRight') {
        if (curIdx < quizData.length - 1) { curIdx++; renderQuestion(); }
      } else if (['a', 'b', 'c', 'd', 'A', 'B', 'C', 'D'].includes(e.key)) {
        const charCode = e.key.toUpperCase().charCodeAt(0) - 65;
        selectOption(charCode);
      }
    });

    renderQuestion();
  </script>
