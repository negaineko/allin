1. 已知 $H_{3}PO_{4}$ 的 $pK_{a_1}\sim pK_{a_3}$ 分别是2.12, 7.21, 12.36, 则 $PO_{4}^{3-}$ 的 $pK_{b_1}$ 为( )
A. 11.88
B. 6.80
C. 1.64
D. 2.12

2. 浓度为 $0.1\text{ mol/L}$ 的某弱酸弱碱盐 $NH_{4}A$ 溶液 $pH=7.00$, 则HA的 $pK_a$ 为( )(已知: $NH_{3}\cdot H_{2}O$ 的 $K_{b}=1.8\times10^{-5}$)
A. 9.26
B. 4.47
C. 7.00
D. 10.00

3. 以下溶液稀释10倍时, pH改变最小的是( )
A. 0.1mol/L $NH_{4}Ac$
B. 0.1mol/L NaAc
C. 0.1mol/L HAc
D. 0.1mol/L HCl

4. 若配制 $pH=9.55$ 缓冲溶液1000mL, 用去400mL氨水 $(15\text{ mol/L})$, 需 $NH_{4}Cl$ ($pK_b=4.75, M_{NH_4Cl}=53.49$) ( )g
A. 100
B. 160
C. 53.50
D. 50

5. 0.1mol/L NaOH 滴定0.1mol/L HAc溶液, 化学计量点时pH为( )
A. 7.0
B. 9.7
C. 8.7
D. 5.3

6. 甲基橙 ($pK_a=3.4$) 的变色范围为3.1~4.0, 用 $0.1\text{ mol/L}$ NaOH 滴定 $0.1\text{ mol/L}$ HCl时, 若刚刚看到混合色时, $[In^{-}]/[HIn]$ 为( )
A. 1.0
B. 2.0
C. 0.5
D. 10.0

7. 关于酸碱指示剂, 下列说法错误的是( )
A. 指示剂本身是有机弱酸或弱碱
B. 指示剂的变色范围越窄越好
C. HIn与In-的颜色差异越大越好
D. 选择指示剂时, 指示剂的变色范围必须全部落在滴定突跃范围之内

8. 用 $0.10\text{ mol/L}$ HCl标准溶液滴定 $0.10\text{ mol/L}$ 乙醇胺 ($pK_b=4.50$) 时, 应选择的指示剂是( )
A. 甲基橙 ($pK_a=3.4$)
B. 溴甲酚绿 ($pK_a=4.9$)
C. 酚红 ($pK_a=8.0$)
D. 酚酞 ($pK_a=9.1$)

9. 某酸碱指示剂的 $K_a=3.0\times10^{-5}$, 此指示剂的酸型是红色, 而碱型是蓝色。欲使指示剂由80%的蓝色变为80%的红色, 溶液的pH必须( )
A. 增加1.2
B. 减少1.2
C. 增加0.75
D. 减少0.75

10. 用0.1mol/L HCl 滴定 0.1mol/L NaOH的pH突跃范围是9.7~4.3。用0.01mol/L HCl 滴定 0.01mol/L NaOH 的pH突跃范围是( )
A. 9.7~4.3
B. 8.7~4.3
C. 9.7~5.3
D. 8.7~5.3

11. 用浓度为 $0.1000\text{ mol/L}$ 的一元酸碱滴定同浓度碱酸, 其pH突跃范围为9.70~4.30, 则一定是( )
A. 强碱滴定强酸
B. 强碱滴定弱酸
C. 强酸滴定强碱
D. 强酸滴定混合弱碱或多元碱

12. 用浓度为 $0.1\text{ mol/L}$ NaOH 滴定同浓度的某弱酸HA或HB, 若HA与HB的滴定突跃范围的差别为+1.0 pH单位, HA和HB离解常数分别用 $K_a^{HA}$ 和 $K_a^{HB}$ 表示, 则 $K_a^{HA}/K_a^{HB}$ 为( )
A. 10
B. 100
C. 0.1
D. 0.01

13. 用 $0.1000\text{ mol/L}$ NaOH 滴定25.00mL $0.1000\text{ mol/L}$ HCl, 若以甲基橙为指示剂, 滴定至 $pH=4.0$ 为终点, 则终点误差(TE)为( )
A. -0.10%
B. -0.20%
C. +0.20%
D. 0.10%

14. 已知混合碱可能是NaOH, $Na_{2}CO_{3}$, $NaHCO_{3}$ 中任何两种物质, 用HCl标准溶液滴定。先加酚酞作指示剂, 后加入甲基橙指示剂, 若 $V_{\text{酚}}<V_{\text{甲}}$, 则此碱液是( )
A. $Na_{2}CO_{3}$
B. NaOH
C. $NaHCO_{3}$
D. $Na_{2}CO_{3}$ 和 $NaHCO_{3}$ 混合物

15. 在水溶液中共轭酸碱对 $K_{a}$ 与 $K_{b}$ 的关系是( )
A. $K_{a}\cdot K_{b}=1$
B. $K_{a}\cdot K_{b}=K_{w}$
C. $K_{a}/K_{b}=K_{w}$
D. $K_{b}/K_{a}=K_{w}$

16. $HPO_{4}^{2-}$ 的共轭碱是( )
A. $H_{2}PO_{4}^{-}$
B. $H_{3}PO_{4}$
C. $PO_{4}^{3-}$
D. $OH^{-}$

17. $OH^{-}$ 的共轭酸是( )
A. $H^{+}$
B. $H_{2}O$
C. $H_{3}O^{+}$
D. $O^{2-}$

18. 在下列各组酸碱组分中,属于共轭酸碱对的是( )
A. HCN-NaCN
B. $H_{3}PO_{4}-Na_{2}HPO_{4}$
C. $^{+}NH_{3}CH_{2}COOH-NH_{2}CH_{2}COO^{-}$
D. $H_{3}O^{+}-OH^{-}$

A. $H_{2}CO_{3}$ 和 $CO_{3}^{2-}$
B. $NH_{3}$ 和 $NH_{2}^{-}$
C. HCl 和 $Cl^{-}$
D. $HSO_{4}^{-}$ 和 $SO_{4}^{2-}$

20. 以下表述中错误的是( )
A. $H_{2}O$ 作为酸的共轭碱是 $OH^{-}$
B. $H_{2}O$ 作为碱的共轭酸是 $H_{3}O^{+}$
C. 因为HAc 的酸性强,故HAc 的碱性必弱
D. HAc 的碱性弱,则 $H_{2}Ac^{+}$ 的酸性强

21. 浓度相同的下列物质水溶液的pH最高的是( )
A. NaCl
B. $NaHCO_{3}$
C. $NH_{4}Cl$
D. $Na_{2}CO_{3}$

A. $CO_{3}^{2-}>S^{2-}>C_{2}O_{4}^{2-}$
B. $S^{2-}>C_{2}O_{4}^{2-}>CO_{3}^{2-}$
C. $S^{2-}>CO_{3}^{2-}>C_{2}O_{4}^{2-}$
D. $C_{2}O_{4}^{2-}>S^{2-}>CO_{3}^{2-}$

A. $pH=7$
B. $[H^{+}]=[OH^{-}]$
C. $pH+pOH=14$
D. $pOH=7$

            correct: ansMap[parseInt(qMatch[1], 10)] || ''
          };
        } else if (optMatch && currentQ) {
          currentQ.options.push({
            key: optMatch[1],
            text: optMatch[2].trim()
          });
        } else if (currentQ) {
          if (currentQ.options.length === 0) {
            currentQ.text += '<br>' + trimmed;
          } else {
            currentQ.options[currentQ.options.length - 1].text += ' ' + trimmed;
          }
        }
      }

      if (currentQ) questions.push(currentQ);
    }

    /**
     * 本地存储处理
     */
    function loadStorage() {
      try {
        const savedAns = localStorage.getItem('anal_chem_acidbase_v1');
        if (savedAns) userAnswers = JSON.parse(savedAns);
        const savedStars = localStorage.getItem('anal_chem_acidbase_stars_v1');
        if (savedStars) starred = new Set(JSON.parse(savedStars));
      } catch (e) {
        console.error('Storage access error', e);
      }
    }

    function saveStorage() {
      localStorage.setItem('anal_chem_acidbase_v1', JSON.stringify(userAnswers));
      localStorage.setItem('anal_chem_acidbase_stars_v1', JSON.stringify(Array.from(starred)));
    }

    function resetProgress() {
      if (confirm('确定要清空酸碱滴定单元全部 134 题的答题记录和收藏吗？')) {
        userAnswers = {};
        starred.clear();
        saveStorage();
        renderUI();
      }
    }

    /**
     * UI 渲染主流程
     */
    function renderUI() {
      if (questions.length === 0) return;
      const q = questions[currentIndex];

      document.getElementById('qMeta').innerText = `单选题 第 ${q.id} / ${questions.length} 题`;
      document.getElementById('qText').innerHTML = q.text;

      const starBtn = document.getElementById('starBtn');
      if (starred.has(q.id)) {
        starBtn.classList.add('starred');
      } else {
        starBtn.classList.remove('starred');
      }

      const optContainer = document.getElementById('optionsContainer');
      optContainer.innerHTML = '';

      const userChoice = userAnswers[q.id];
      const isAnswered = !!userChoice;

      q.options.forEach(opt => {
        const optDiv = document.createElement('div');
        optDiv.className = 'option-item';
        
        if (mode === 'practice' && isAnswered) {
          if (opt.key === q.correct) {
            optDiv.classList.add('correct');
          } else if (opt.key === userChoice) {
            optDiv.classList.add('wrong');
          }
        } else if (mode === 'exam' && userChoice === opt.key) {
          optDiv.classList.add('selected');
        }

        optDiv.onclick = () => selectOption(opt.key);

        optDiv.innerHTML = `
          <div class="option-key">${opt.key}</div>
          <div class="option-text">${opt.text}</div>
        `;
        optContainer.appendChild(optDiv);
      });

      const banner = document.getElementById('resultBanner');
      if (mode === 'practice' && isAnswered) {
        banner.className = 'result-banner show ' + (userChoice === q.correct ? 'correct-banner' : 'wrong-banner');
        banner.innerHTML = userChoice === q.correct 
          ? `🎉 回答正确！标准答案：<b>${q.correct}</b>` 
          : `❌ 回答错误。你的选择：<b>${userChoice}</b>，标准答案：<b>${q.correct}</b>`;
      } else {
        banner.className = 'result-banner';
      }

      document.getElementById('prevBtn').disabled = (currentIndex === 0);
      document.getElementById('nextBtn').disabled = (currentIndex === questions.length - 1);

      updateStatsAndCard();

      if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise([document.querySelector('.question-pane')]);
      }
    }

    function selectOption(key) {
      const q = questions[currentIndex];
      userAnswers[q.id] = key;
      saveStorage();
      renderUI();
    }

    function toggleStar() {
      const q = questions[currentIndex];
      if (starred.has(q.id)) {
        starred.delete(q.id);
      } else {
        starred.add(q.id);
      }
      saveStorage();
      renderUI();
    }

    function navigate(delta) {
      const nextIdx = currentIndex + delta;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIndex = nextIdx;
        renderUI();
      }
    }

    function jumpTo(index) {
      currentIndex = index;
      renderUI();
    }

    function setMode(newMode) {
      mode = newMode;
      document.getElementById('modePractice').classList.toggle('active', mode === 'practice');
      document.getElementById('modeExam').classList.toggle('active', mode === 'exam');
      renderUI();
    }

    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      updateStatsAndCard();
    }

    function updateStatsAndCard() {
      let doneCount = 0;
      let correctCount = 0;

      questions.forEach(q => {
        if (userAnswers[q.id]) {
          doneCount++;
          if (userAnswers[q.id] === q.correct) correctCount++;
        }
      });

      document.getElementById('statDone').innerText = `${doneCount}/${questions.length}`;
      document.getElementById('statStar').innerText = starred.size;
      const rate = doneCount === 0 ? 0 : Math.round((correctCount / doneCount) * 100);
      document.getElementById('statRate').innerText = `${rate}%`;

      const grid = document.getElementById('cardGrid');
      grid.innerHTML = '';

      questions.forEach((q, idx) => {
        const uAns = userAnswers[q.id];
        const isWrong = uAns && uAns !== q.correct;
        const isStar = starred.has(q.id);

        if (currentFilter === 'wrong' && !isWrong) return;
        if (currentFilter === 'star' && !isStar) return;

        const item = document.createElement('div');
        item.className = 'card-item';
        if (idx === currentIndex) item.classList.add('active');

        if (mode === 'practice') {
          if (uAns) {
            item.classList.add(uAns === q.correct ? 'correct' : 'wrong');
          }
        } else {
          if (uAns) item.classList.add('answered-exam');
        }

        item.innerText = q.id;
        if (isStar) {
          const starIcon = document.createElement('span');
          starIcon.className = 'star-dot';
          starIcon.innerText = '★';
          item.appendChild(starIcon);
        }

        item.onclick = () => jumpTo(idx);
        grid.appendChild(item);
      });
    }

    function bindShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

        const key = e.key.toUpperCase();
        if (['A', 'B', 'C', 'D', 'E'].includes(key)) {
          selectOption(key);
        } else if (e.key === 'ArrowLeft') {
          navigate(-1);
        } else if (e.key === 'ArrowRight') {
          navigate(1);
        }
      });
    }
  </script>
</body>
</html>
