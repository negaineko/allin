        let currentIdx = 0;
        let mode = 'practice';
        let filter = 'all';
        let appState = { userAnswers: {}, isFav: {}, isSubmitted: {} };

        function loadState() {
            const saved = localStorage.getItem('pchem_ch7_state');
            if (saved) { try { appState = JSON.parse(saved); } catch(e) {} }
        }
        function saveState() {
            localStorage.setItem('pchem_ch7_state', JSON.stringify(appState));
            updateStats();
        }
        function normalizeStr(str) {
            if (!str) return "";
            return str.toString().trim().toLowerCase().replace(/[\uff01-\uff5e]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0)).replace(/\s+/g, "");
        }
        function checkBlank(userVal, acceptedList) {
            const cleanUser = normalizeStr(userVal);
            if (!cleanUser) return false;
            return acceptedList.some(ans => normalizeStr(ans) === cleanUser);
        }
        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('qNumTag').innerText = `第 ${q.id} 题 / 共 ${questions.length} 题`;
            document.getElementById('qScoreTag').innerText = `${q.score} 分 (${q.code})`;
            const favBtn = document.getElementById('favBtn');
            favBtn.className = 'fav-btn' + (appState.isFav[q.id] ? ' active' : '');

            let htmlText = q.text;
            for (let i = 0; i < q.blanks; i++) {
                const val = (appState.userAnswers[q.id] && appState.userAnswers[q.id][i]) || '';
                const inputHtml = `<input type="text" class="blank-input" data-blank-idx="${i}" value="${val.replace(/"/g, '&quot;')}" oninput="onBlankInput(${q.id}, ${i}, this.value)" onkeydown="onBlankKeyDown(event, ${i})" />`;
                htmlText = htmlText.replace(`{{${i}}}`, inputHtml);
            }
            const contentEl = document.getElementById('qContent');
            contentEl.innerHTML = htmlText;
            document.getElementById('prevBtn').disabled = (currentIdx === 0);
            document.getElementById('nextBtn').disabled = (currentIdx === questions.length - 1);

            if (window.MathJax && MathJax.typesetPromise) {
                MathJax.typesetPromise([contentEl]).catch((err) => console.log('MathJax error:', err));
            }
            updateQuestionFeedback();
            renderNavGrid();
        }
        function onBlankInput(qId, blankIdx, val) {
            if (!appState.userAnswers[qId]) appState.userAnswers[qId] = [];
            appState.userAnswers[qId][blankIdx] = val;
            saveState();
        }
        function onBlankKeyDown(event, blankIdx) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const inputs = document.querySelectorAll('.blank-input');
                if (blankIdx + 1 < inputs.length) { inputs[blankIdx + 1].focus(); } else { submitCurrentAnswer(); }
            }
        }
        function submitCurrentAnswer() {
            const q = questions[currentIdx];
            appState.isSubmitted[q.id] = true;
            saveState();
            updateQuestionFeedback();
            renderNavGrid();
        }
        function updateQuestionFeedback() {
            const q = questions[currentIdx];
            const feedbackBox = document.getElementById('feedbackBox');
            const inputs = document.querySelectorAll('.blank-input');
            const isSubmitted = appState.isSubmitted[q.id];

            if (!isSubmitted && mode === 'practice') {
                feedbackBox.className = 'feedback-box';
                inputs.forEach(inp => { inp.className = 'blank-input'; });
                return;
            }
            if (mode === 'exam' && !appState.examFinished) {
                feedbackBox.className = 'feedback-box';
                inputs.forEach(inp => { inp.className = 'blank-input'; });
                return;
            }
            let allCorrect = true;
            let ansSummary = [];
            q.answers.forEach((acceptedList, idx) => {
                const userVal = (appState.userAnswers[q.id] && appState.userAnswers[q.id][idx]) || '';
                const isCorrect = checkBlank(userVal, acceptedList);
                if (!isCorrect) allCorrect = false;
                if (inputs[idx]) { inputs[idx].className = 'blank-input ' + (isCorrect ? 'correct' : 'incorrect'); }
                ansSummary.push(`空 (${idx + 1}): ${acceptedList[0]}`);
            });
            feedbackBox.className = 'feedback-box show ' + (allCorrect ? 'correct' : 'incorrect');
            document.getElementById('feedbackTitle').innerHTML = allCorrect ? '✔ 回答完全正确！' : '✘ 存在错误或未填写完整';
            const answersEl = document.getElementById('feedbackAnswers');
            answersEl.innerHTML = ansSummary.join('<br>') + (q.explanation ? `<div style="margin-top:8px;font-family:inherit;color:var(--gray-600);font-size:0.88rem;"><strong>解析：</strong>${q.explanation}</div>` : '');
            if (window.MathJax && MathJax.typesetPromise) { MathJax.typesetPromise([answersEl]).catch((err) => console.log('MathJax error:', err)); }
        }
        function toggleFav() {
            const qId = questions[currentIdx].id;
            appState.isFav[qId] = !appState.isFav[qId];
            saveState();
            document.getElementById('favBtn').className = 'fav-btn' + (appState.isFav[qId] ? ' active' : '');
            renderNavGrid();
        }
        function prevQ() { if (currentIdx > 0) { currentIdx--; renderQuestion(); } }
        function nextQ() { if (currentIdx < questions.length - 1) { currentIdx++; renderQuestion(); } }
        function jumpToQ(index) { currentIdx = index; renderQuestion(); }
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('modePractice').className = 'mode-btn' + (mode === 'practice' ? ' active' : '');
            document.getElementById('modeExam').className = 'mode-btn' + (mode === 'exam' ? ' active' : '');
            document.getElementById('submitBtn').style.display = (mode === 'practice' ? 'inline-flex' : 'none');
            document.getElementById('examSubmitBtn').style.display = (mode === 'exam' ? 'inline-flex' : 'none');
            renderQuestion();
        }
        function submitExam() {
            if (confirm("确定要提交整套考卷吗？提交后将显示所有题目的正误与参考答案。")) {
                appState.examFinished = true;
                questions.forEach(q => { appState.isSubmitted[q.id] = true; });
                saveState();
                renderQuestion();
                alert("已完成判分！请查看右侧答题卡错题与各题解析。");
            }
        }
        function setFilter(newFilter) {
            filter = newFilter;
            document.getElementById('tabAll').className = 'filter-btn' + (filter === 'all' ? ' active' : '');
            document.getElementById('tabWrong').className = 'filter-btn' + (filter === 'wrong' ? ' active' : '');
            document.getElementById('tabFav').className = 'filter-btn' + (filter === 'fav' ? ' active' : '');
            renderNavGrid();
        }
        function isQuestionCorrect(q) {
            const uAns = appState.userAnswers[q.id];
            if (!uAns) return false;
            return q.answers.every((acc, idx) => checkBlank(uAns[idx], acc));
        }
        function isQuestionFilled(q) {
            const uAns = appState.userAnswers[q.id];
            if (!uAns) return false;
            return uAns.some(val => val && val.trim() !== "");
        }
        function updateStats() {
            let completed = 0, correctCount = 0, favCount = 0;
            questions.forEach(q => {
                if (isQuestionFilled(q)) completed++;
                if (isQuestionCorrect(q)) correctCount++;
                if (appState.isFav[q.id]) favCount++;
            });
            document.getElementById('statCompleted').innerText = `${completed}/${questions.length}`;
            const acc = completed > 0 ? Math.round((correctCount / questions.length) * 100) : 0;
            document.getElementById('statAccuracy').innerText = `${acc}%`;
            document.getElementById('statFavorites').innerText = favCount;
        }
        function renderNavGrid() {
            const container = document.getElementById('gridCard');
            container.innerHTML = '';
            questions.forEach((q, idx) => {
                const isCorrect = isQuestionCorrect(q);
                const isFilled = isQuestionFilled(q);
                const isSubmitted = appState.isSubmitted[q.id];
                const isFav = appState.isFav[q.id];
                if (filter === 'wrong' && (isCorrect || !isSubmitted)) return;
                if (filter === 'fav' && !isFav) return;
                const btn = document.createElement('button');
                btn.className = 'grid-btn';
                if (idx === currentIdx) btn.classList.add('current');
                if (mode === 'practice' || appState.examFinished) {
                    if (isSubmitted) btn.classList.add(isCorrect ? 'correct' : 'incorrect');
                } else {
                    if (isFilled) btn.classList.add('exam-filled');
                }
                btn.innerText = q.id;
                btn.onclick = () => jumpToQ(idx);
                if (isFav) {
                    const dot = document.createElement('span');
                    dot.className = 'star-dot';
                    btn.appendChild(dot);
                }
                container.appendChild(btn);
            });
        }
        function resetProgress() {
            if (confirm("确定要重置所有做题记录和收藏吗？")) {
                localStorage.removeItem('pchem_ch7_state');
                appState = { userAnswers: {}, isFav: {}, isSubmitted: {}, examFinished: false };
                currentIdx = 0;
                renderQuestion();
                updateStats();
            }
        }
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;
            if (e.key === 'ArrowLeft') prevQ();
            else if (e.key === 'ArrowRight') nextQ();
        });
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderQuestion();
            updateStats();
        });
    </script>
</body>
